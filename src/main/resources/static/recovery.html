<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重新识别 - Music Auto Tagger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:24px;color:#333}.container{max-width:1180px;margin:auto}.header,.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 24px #0002}.header{background:#ffffff20;color:#fff;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.header a,.header button,.btn{border:0;border-radius:8px;padding:9px 15px;cursor:pointer;text-decoration:none}.header a,.header button{background:#ffffff2e;color:#fff}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{background:#eee}.tab.active{background:#667eea;color:#fff}.item{border:1px solid #eee;border-left:4px solid #17a2b8;border-radius:10px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}.item.failed{border-left-color:#dc3545}.name{font-weight:650;word-break:break-all}.meta{font-size:.84em;color:#777;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{color:#fff;background:#667eea}.btn.llm{background:#6c757d}.btn:disabled{opacity:.5;cursor:not-allowed}.empty{text-align:center;color:#888;padding:35px}.jobs{margin-top:20px}.job{padding:10px;border-bottom:1px solid #eee;font-size:.9em}.RUNNING{color:#856404}.SUCCEEDED{color:#237a35}.WAITING_REVIEW{color:#0c6470}.FAILED{color:#b02a37}.hint{font-size:.84em;color:#777;line-height:1.6}.toast{position:fixed;right:20px;bottom:20px;background:#333;color:#fff;padding:12px 18px;border-radius:8px;display:none;max-width:450px}
</style>
</head>
<body><div class="container">
<div class="header"><div><h2 style="margin:0">重新识别与辅助恢复</h2><div style="opacity:.85;margin-top:5px">手动重试部分识别和识别失败的文件夹；任务在后台执行。</div></div><div><button onclick="loadAll()">刷新</button> <a href="review.html">待确认</a> <a href="index.html">返回面板</a></div></div>
<div class="card"><div class="tabs"><button class="tab active" id="partialTab" onclick="setTab('PARTIAL')">部分识别</button><button class="tab" id="failedTab" onclick="setTab('FAILED')">识别失败</button></div><div class="hint">“重新识别”会重新运行快速扫描、音频指纹和 MusicBrainz 流程；成功后清理隔离副本。部分识别还可单独使用 LLM，把已有艺术家标签匹配到输出目录中的艺术家文件夹。LLM 不会自由创建新艺术家。</div><div id="list"><div class="empty">加载中...</div></div></div>
<div class="card jobs"><h3 style="margin-top:0">最近任务</h3><div id="jobs"><div class="empty">暂无任务</div></div></div>
</div><div id="toast" class="toast"></div>
<script>
let csrfToken=null,currentTab='PARTIAL',items=[],onlineSearchAvailable=false;
const errors={'csrf.invalid':'会话已失效，请重新登录','recovery.already.running':'该项目正在处理中','recovery.item.not.found':'文件或文件夹已不存在','recovery.llm.partial.only':'LLM 辅助仅支持部分识别项目','recovery.directory.not.configured':'对应目录尚未配置','llm.web.search.unavailable':'未配置可用的联网搜索端点'};
async function init(){const r=await fetch('/api/auth/status'),d=await r.json();if(!d.authenticated){location.href='/index.html';return}csrfToken=d.csrfToken;loadAll();setInterval(loadJobs,3000)}
async function api(path,opt={}){opt.headers=opt.headers||{};if(csrfToken)opt.headers['X-CSRF-Token']=csrfToken;if(opt.body)opt.headers['Content-Type']='application/json';const r=await fetch(path,opt);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(errors[d.error]||d.error||('HTTP '+r.status));return d}
function setTab(tab){currentTab=tab;document.getElementById('partialTab').classList.toggle('active',tab==='PARTIAL');document.getElementById('failedTab').classList.toggle('active',tab==='FAILED');render()}
async function loadAll(){try{const d=await api('/api/recovery/list');items=d.items||[];onlineSearchAvailable=!!d.onlineSearchAvailable;render();renderJobs(d.jobs||[])}catch(e){toast('加载失败: '+e.message)}}
async function loadJobs(){try{const d=await api('/api/recovery/jobs');renderJobs(d.jobs||[]);if((d.jobs||[]).some(j=>j.status==='RUNNING'))return;const hadRunning=document.querySelector('.job.RUNNING');if(hadRunning)loadAll()}catch(e){}}
function render(){const list=items.filter(i=>i.sourceType===currentTab),el=document.getElementById('list');if(!list.length){el.innerHTML='<div class="empty">该目录没有可恢复项目</div>';return}el.innerHTML=list.map(i=>`<div class="item ${i.sourceType==='FAILED'?'failed':''}"><div><div class="name">${esc(i.name)}</div><div class="meta">${i.directory?'文件夹':'文件'} · ${i.fileCount} 个音频文件 · ${esc(i.path)}</div></div><div class="actions"><button class="btn" ${i.running?'disabled':''} onclick='retryMode(${JSON.stringify(i.sourceType)},${JSON.stringify(i.relativePath)},"REIDENTIFY")'>完整重新识别</button><button class="btn llm" ${i.running||!onlineSearchAvailable?'disabled':''} onclick='onlineSearch(${JSON.stringify(i.sourceType)},${JSON.stringify(i.relativePath)},${i.fileCount})'>联网辅助识别</button>${i.sourceType==='PARTIAL'?`<button class="btn llm" ${i.running?'disabled':''} onclick='retryMode(${JSON.stringify(i.sourceType)},${JSON.stringify(i.relativePath)},"LOCAL_ARTIST_MATCH")'>仅匹配艺术家目录</button>`:''}</div></div>`).join('')}
function renderJobs(jobs){const el=document.getElementById('jobs');if(!jobs.length){el.innerHTML='<div class="empty">暂无任务</div>';return}el.innerHTML=jobs.slice(0,20).map(j=>`<div class="job ${j.status}"><strong>${esc(j.relativePath)}</strong> · ${j.useLlm?'LLM 辅助':'重新识别'} · <span>${status(j.status)}</span><div class="meta">${esc(j.message||'处理中...')}</div></div>`).join('')}
function status(s){return({RUNNING:'处理中',SUCCEEDED:'成功',WAITING_REVIEW:'等待人工确认',FAILED:'失败'})[s]||s}
async function retryMode(sourceType,relativePath,mode,analyzeCover=false){const msg=mode==='REIDENTIFY'?'现在按完整专辑重新执行识别？':mode==='LOCAL_ARTIST_MATCH'?'现在只匹配已有艺术家目录？':'现在开始联网辅助识别？';if(!confirm(msg))return;try{await api('/api/recovery/retry',{method:'POST',body:JSON.stringify({sourceType,relativePath,mode,analyzeCover})});toast('任务已提交，将在后台执行');loadAll()}catch(e){toast('提交失败: '+e.message)}}
async function onlineSearch(sourceType,relativePath,fileCount){if(!confirm(`确认开始联网辅助识别？\n\n文件数：${fileCount}\n最多两轮原生网络搜索、最多 5 个候选，可能产生额外 API 费用。\n当前仅支持文本搜索（封面视觉分析尚未接入）。\n\n结果只生成候选，必须在待确认页人工确认。`))return;try{await api('/api/recovery/retry',{method:'POST',body:JSON.stringify({sourceType,relativePath,mode:'ONLINE_SEARCH',analyzeCover:false})});toast('联网搜索任务已提交');loadAll()}catch(e){toast('提交失败: '+e.message)}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4500)}function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
init();
</script></body></html>
