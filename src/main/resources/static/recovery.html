<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title-key="recovery.page.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重新识别 - Music Auto Tagger</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="app.css?v=8">
    <script src="i18n.js?v=1"></script>
    <style>
        .tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }

        .tab {
            border: none;
            background: transparent;
            color: var(--text-soft);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: .15s;
        }
        .tab:hover { background: #fff; color: var(--primary); }
        .tab.active { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(29, 110, 240, .25); }

        .notice {
            background: var(--primary-soft);
            border: 1px solid #d6e4fd;
            border-radius: var(--radius);
            padding: 12px 14px;
            font-size: 12.5px;
            color: #1e40af;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .items { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

        .item {
            border: 1px solid var(--border);
            border-left: 3px solid var(--info);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            background: #fff;
            transition: box-shadow .15s ease;
        }
        .item:hover { box-shadow: var(--shadow); }
        .item.failed { border-left-color: var(--danger); }
        .item .name { font-weight: 650; word-break: break-all; font-size: 13.5px; }
        .item .meta { font-size: 12px; color: var(--text-mute); margin-top: 5px; word-break: break-all; }
        .item .meta.warn { color: var(--danger); }
        .item-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }

        .job {
            padding: 11px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }
        .job:last-child { border-bottom: none; }
        .job .job-name { font-weight: 650; word-break: break-all; }
        .job .meta { font-size: 12px; color: var(--text-mute); width: 100%; }

        .job-status { font-weight: 600; }
        .RUNNING .job-status { color: var(--warn); }
        .SUCCEEDED .job-status { color: var(--success); }
        .WAITING_REVIEW .job-status { color: var(--info); }
        .FAILED .job-status { color: var(--danger); }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="topbar-main">
            <div class="brand">
                <img class="brand-logo" src="logo.png" alt="Music Auto Tagger">
                <div>
                    <div class="brand-title" data-i18n="recovery.page.title">重新识别与辅助恢复</div>
                    <div class="brand-subtitle" data-i18n="recovery.page.subtitle">手动重试部分识别与识别失败的文件夹，任务在后台执行</div>
                </div>
            </div>
        </div>
        <nav class="navbar">
            <button class="nav-toggle" onclick="document.getElementById('navGroup').classList.toggle('open')" aria-label="menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                <span data-i18n="web.menu">菜单</span>
            </button>
            <div class="nav-group" id="navGroup">
                <button class="nav-btn" onclick="loadAll()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    <span data-i18n="recovery.nav.refresh">刷新</span>
                </button>
                <a class="nav-btn" href="review.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    <span data-i18n="web.review">待确认</span>
                </a>
                <a class="nav-btn active" href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"></path><path d="M9 21V12h6v9"></path><path d="M5 10v11h14V10"></path></svg>
                    <span data-i18n="recovery.nav.back">返回面板</span>
                </a>
            </div>
        </nav>
    </header>

    <section class="card" style="margin-bottom: 18px;">
        <div class="tabs">
            <button class="tab active" id="partialTab" onclick="setTab('PARTIAL')" data-i18n="recovery.tab.partial">部分识别</button>
            <button class="tab" id="failedTab" onclick="setTab('FAILED')" data-i18n="recovery.tab.failed">识别失败</button>
            <button class="tab" id="trashTab" onclick="setTab('TRASH')" data-i18n="recovery.tab.trash">回收站</button>
        </div>
        <div class="notice">
            <div data-i18n="recovery.notice.1">「部分识别」与「识别失败」通常是互斥状态：完整写入部分识别目录后不再重复生成失败副本；处理异常、目标撞名或 LLM 自动归档时仍保留失败副本供复核。</div>
            <div data-i18n="recovery.notice.2">「重新识别」会重新运行快速扫描、音频指纹和 MusicBrainz 流程；成功后当前隔离副本及另一分类中升级前遗留的同名副本都会遵循回收站保留策略。</div>
            <div data-i18n="recovery.notice.3">部分识别还可单独使用 LLM，把已有艺术家标签匹配到输出目录中的艺术家文件夹。LLM 不会自由创建新艺术家。</div>
        </div>
        <div class="items" id="list"><div class="empty" data-i18n="recovery.loading">加载中...</div></div>
    </section>

    <section class="card">
        <div class="card-head section-underline">
            <div class="card-title">
                <span class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
                </span>
                <span data-i18n="recovery.recent.jobs">最近任务</span>
            </div>
        </div>
        <div id="jobs"><div class="empty" data-i18n="recovery.no.jobs">暂无任务</div></div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <a href="https://032.im" target="_blank" rel="noopener">Lux032</a>
            <span class="footer-divider">|</span>
            <a href="https://github.com/lux032/MusicAutoTagger" target="_blank" rel="noopener">Music Auto Tagger</a>
        </div>
    </footer>
</div>

<!-- 通用确认弹窗：替代原来的 confirm()，可以放多行说明 -->
<div class="overlay" id="confirmDialog">
    <div class="dialog" style="width: min(480px, 96vw);">
        <div class="dialog-title" id="confirmTitle" data-i18n="recovery.confirm.title">确认操作</div>
        <div class="dialog-subtitle" id="confirmBody" style="white-space: pre-line;"></div>
        <div class="dialog-actions">
            <button class="btn ghost" onclick="closeConfirm(false)" data-i18n="web.cancel">取消</button>
            <button class="btn primary" id="confirmOkBtn" onclick="closeConfirm(true)" data-i18n="recovery.confirm.ok">确认</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    let csrfToken = null, currentTab = 'PARTIAL', items = [], trashItems = [], onlineSearchAvailable = false;
    const T = (k, d) => I18n.t(k, d);
    const TF = (k, ...a) => I18n.tf(k, ...a);

    const errorKeys = {
        'csrf.invalid': 'recovery.error.csrf',
        'recovery.already.running': 'recovery.error.already.running',
        'recovery.item.not.found': 'recovery.error.item.not.found',
        'recovery.llm.partial.only': 'recovery.error.llm.partial.only',
        'recovery.directory.not.configured': 'recovery.error.directory.not.configured',
        'llm.web.search.unavailable': 'recovery.error.web.search.unavailable',
        'trash.restore.target.exists': 'recovery.error.restore.target.exists',
        'trash.manifest.missing': 'recovery.error.manifest.missing',
        'trash.manifest.invalid': 'recovery.error.manifest.invalid',
        'trash.entry.not.found': 'recovery.error.entry.not.found',
        'trash.id.invalid': 'recovery.error.id.invalid'
    };

    // ---------- 弹窗：用同一个 Promise 化的确认框替换原生 confirm ----------
    let confirmResolver = null;

    function ask(title, body, okLabel, danger) {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmBody').textContent = body || '';
        const ok = document.getElementById('confirmOkBtn');
        ok.textContent = okLabel || T('recovery.confirm.ok');
        ok.className = 'btn ' + (danger ? 'danger' : 'primary');
        document.getElementById('confirmDialog').classList.add('show');
        return new Promise(resolve => { confirmResolver = resolve; });
    }

    function closeConfirm(result) {
        document.getElementById('confirmDialog').classList.remove('show');
        if (confirmResolver) {
            confirmResolver(result);
            confirmResolver = null;
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeConfirm(false); });
    document.getElementById('confirmDialog').addEventListener('mousedown', e => {
        if (e.target.id === 'confirmDialog') closeConfirm(false);
    });

    // ---------- 基础 ----------
    async function init() {
        await I18n.load();
        I18n.apply();
        const r = await fetch('/api/auth/status'), d = await r.json();
        if (!d.authenticated) { location.href = '/index.html'; return; }
        csrfToken = d.csrfToken;
        loadAll();
        setInterval(loadJobs, 3000);
    }

    async function api(path, opt = {}) {
        opt.headers = opt.headers || {};
        if (csrfToken) opt.headers['X-CSRF-Token'] = csrfToken;
        if (opt.body) opt.headers['Content-Type'] = 'application/json';
        const r = await fetch(path, opt);
        let d = {};
        try { d = await r.json(); } catch (e) { /* ignore */ }
        if (!r.ok) throw new Error(errorKeys[d.error] ? T(errorKeys[d.error]) : (d.error || ('HTTP ' + r.status)));
        return d;
    }

    function setTab(tab) {
        currentTab = tab;
        for (const [id, val] of [['partialTab', 'PARTIAL'], ['failedTab', 'FAILED'], ['trashTab', 'TRASH']]) {
            document.getElementById(id).classList.toggle('active', tab === val);
        }
        if (tab === 'TRASH') loadTrash(); else render();
    }

    // ---------- 回收站 ----------
    async function loadTrash() {
        try {
            const d = await api('/api/recovery/trash');
            trashItems = d.items || [];
            render();
        } catch (e) {
            toast(TF('recovery.trash.load.failed', e.message));
        }
    }

    function renderTrash() {
        const el = document.getElementById('list');
        if (!trashItems.length) { el.innerHTML = `<div class="empty">${esc(T('recovery.trash.empty'))}</div>`; return; }
        el.innerHTML = trashItems.map(i => `
            <div class="item">
                <div>
                    <div class="name">${esc(i.relativePath || i.id)}</div>
                    <div class="meta">
                        ${i.sourceType ? esc(i.sourceType) : esc(T('recovery.source.unknown'))} · ${esc(TF('recovery.audio.files', i.fileCount))} ·
                        ${esc(TF('recovery.trashed.at', i.trashedAt && i.trashedAt < 8640000000000000 ? new Date(i.trashedAt).toLocaleString() : T('recovery.unknown')))}
                    </div>
                    ${i.restorable ? '' : `<div class="meta warn">${esc(T('recovery.manifest.broken'))}</div>`}
                </div>
                <div class="item-actions">
                    <button class="btn ghost sm" ${i.restorable ? '' : 'disabled'}
                        onclick='restoreTrash(${JSON.stringify(i.id)},${JSON.stringify(i.relativePath || i.id)})'>${esc(T('recovery.restore'))}</button>
                    <button class="btn danger sm"
                        onclick='deleteTrash(${JSON.stringify(i.id)},${JSON.stringify(i.relativePath || i.id)})'>${esc(T('recovery.delete.forever'))}</button>
                </div>
            </div>`).join('');
    }

    async function restoreTrash(id, name) {
        const ok = await ask(T('recovery.restore.title'),
            TF('recovery.restore.body', name),
            T('recovery.restore'));
        if (!ok) return;
        try {
            await api('/api/recovery/trash-restore', { method: 'POST', body: JSON.stringify({ id }) });
            toast(T('recovery.restored'));
            loadTrash();
        } catch (e) { toast(TF('recovery.restore.failed', e.message)); }
    }

    async function deleteTrash(id, name) {
        const ok = await ask(T('recovery.delete.forever'), TF('recovery.delete.body', name), T('recovery.delete.forever'), true);
        if (!ok) return;
        try {
            await api('/api/recovery/trash-delete', { method: 'POST', body: JSON.stringify({ id }) });
            toast(T('recovery.deleted'));
            loadTrash();
        } catch (e) { toast(TF('recovery.delete.failed', e.message)); }
    }

    // ---------- 列表与任务 ----------
    async function loadAll() {
        try {
            const d = await api('/api/recovery/list');
            items = d.items || [];
            onlineSearchAvailable = !!d.onlineSearchAvailable;
            render();
            renderJobs(d.jobs || []);
        } catch (e) { toast(TF('recovery.load.failed', e.message)); }
    }

    async function loadJobs() {
        try {
            const d = await api('/api/recovery/jobs');
            renderJobs(d.jobs || []);
            if ((d.jobs || []).some(j => j.status === 'RUNNING')) return;
            if (document.querySelector('.job.RUNNING')) loadAll();
        } catch (e) { /* 轮询失败静默重试 */ }
    }

    function render() {
        if (currentTab === 'TRASH') { renderTrash(); return; }
        const list = items.filter(i => i.sourceType === currentTab);
        const el = document.getElementById('list');
        if (!list.length) { el.innerHTML = `<div class="empty">${esc(T('recovery.empty'))}</div>`; return; }
        el.innerHTML = list.map(i => `
            <div class="item ${i.sourceType === 'FAILED' ? 'failed' : ''}">
                <div>
                    <div class="name">${esc(i.name)}</div>
                    <div class="meta">${esc(i.directory ? T('recovery.item.folder') : T('recovery.item.file'))} · ${esc(TF('recovery.audio.files', i.fileCount))} · ${esc(i.path)}</div>
                </div>
                <div class="item-actions">
                    <button class="btn primary sm" ${i.running ? 'disabled' : ''}
                        onclick='retryMode(${JSON.stringify(i.sourceType)},${JSON.stringify(i.relativePath)},"REIDENTIFY")'>${esc(T('recovery.btn.reidentify'))}</button>
                    <button class="btn soft sm" ${i.running || !onlineSearchAvailable ? 'disabled' : ''}
                        onclick='onlineSearch(${JSON.stringify(i.sourceType)},${JSON.stringify(i.relativePath)},${i.fileCount})'>${esc(T('recovery.btn.online'))}</button>
                    ${i.sourceType === 'PARTIAL' ? `<button class="btn ghost sm" ${i.running ? 'disabled' : ''}
                        onclick='retryMode(${JSON.stringify(i.sourceType)},${JSON.stringify(i.relativePath)},"LOCAL_ARTIST_MATCH")'>${esc(T('recovery.btn.artist.only'))}</button>` : ''}
                </div>
            </div>`).join('');
    }

    function renderJobs(jobs) {
        const el = document.getElementById('jobs');
        if (!jobs.length) { el.innerHTML = `<div class="empty">${esc(T('recovery.no.jobs'))}</div>`; return; }
        el.innerHTML = jobs.slice(0, 20).map(j => `
            <div class="job ${j.status}">
                <span class="job-name">${esc(j.relativePath)}</span>
                <span class="badge">${esc(j.useLlm ? T('recovery.job.llm') : T('recovery.job.reidentify'))}</span>
                <span class="job-status">${esc(status(j.status))}</span>
                <div class="meta">${esc(j.message || T('recovery.job.processing'))}</div>
            </div>`).join('');
    }

    function status(s) {
        const keys = {
            RUNNING: 'recovery.status.running',
            SUCCEEDED: 'recovery.status.succeeded',
            WAITING_REVIEW: 'recovery.status.waiting',
            FAILED: 'recovery.status.failed'
        };
        return keys[s] ? T(keys[s]) : s;
    }

    async function retryMode(sourceType, relativePath, mode, analyzeCover = false) {
        const msg = mode === 'REIDENTIFY' ? T('recovery.ask.reidentify')
            : mode === 'LOCAL_ARTIST_MATCH' ? T('recovery.ask.artist')
            : T('recovery.ask.online.start');
        if (!await ask(T('recovery.ask.reidentify.title'), relativePath + '\n\n' + msg, T('recovery.ask.start'))) return;
        try {
            await api('/api/recovery/retry', {
                method: 'POST',
                body: JSON.stringify({ sourceType, relativePath, mode, analyzeCover })
            });
            toast(T('recovery.submitted'));
            loadAll();
        } catch (e) { toast(TF('recovery.submit.failed', e.message)); }
    }

    async function onlineSearch(sourceType, relativePath, fileCount) {
        const ok = await ask(T('recovery.online.title'),
            TF('recovery.online.body', fileCount),
            T('recovery.online.start'));
        if (!ok) return;
        try {
            await api('/api/recovery/retry', {
                method: 'POST',
                body: JSON.stringify({ sourceType, relativePath, mode: 'ONLINE_SEARCH', analyzeCover: false })
            });
            toast(T('recovery.online.submitted'));
            loadAll();
        } catch (e) { toast(TF('recovery.submit.failed', e.message)); }
    }

    function toast(t) {
        const e = document.getElementById('toast');
        e.textContent = t;
        e.style.display = 'block';
        setTimeout(() => e.style.display = 'none', 4500);
    }

    function esc(t) {
        return String(t == null ? '' : t)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    init();
</script>
</body>
</html>
