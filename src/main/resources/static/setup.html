                const data = await apiJson('/api/llm/providers/models', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: p.id,
                        apiUrl: p.apiUrl.trim(),
                        apiKey: p.apiKey.trim(),
                        format: p.format,
                        proxy: currentProxyPayload()
                    })
                });
                const models = data.models || [];
                p.pickerModels = models;
                p.fetchStatus = { type: 'ok', msg: tf('setup.s4.llm.fetched', models.length) };
                if (data.suggestedApiUrl && data.suggestedApiUrl !== p.apiUrl.trim()) {
                    p.suggestedUrl = data.suggestedApiUrl;
                }
            } catch (e) {
                const detail = (e.data && e.data.detail) ? e.data.detail : e.message;
                p.fetchStatus = { type: 'err', msg: detail };
                p.pickerModels = null;
            }
            renderStepBody();
        }

        function applySuggestedUrl(idx) {
            const p = state.llmProviders[idx];
            if (p && p.suggestedUrl) {
                p.apiUrl = p.suggestedUrl;
                p.suggestedUrl = null;
                state.providersDirty = true;
                renderStepBody();
            }
        }

        function applyPickedModels(idx) {
            const checked = Array.from(document.querySelectorAll(`#pickerList${idx} input[type="checkbox"]:checked`)).map(el => el.value);
            const prev = new Map((state.llmProviders[idx].models || []).map(m => [m.id, m]));
            state.llmProviders[idx].models = checked.map(id => prev.get(id) || { id, enabled: true, webSearch: false });
            state.llmProviders[idx].pickerModels = null;
            state.providersDirty = true;
            renderStepBody();
        }

        async function testTavily() {
            const key = (state.tavilyApiKey || '').trim();
            if (!key) {
                state.tavilyTest = { state: 'err', msg: t('setup.s4.tavily.needKey') };
                renderStepBody();
                return;
            }
            state.tavilyTest = { state: 'loading', msg: '' };
            renderStepBody();
            try {
                const data = await apiJson('/api/setup/test-tavily', {
                    method: 'POST',
                    body: JSON.stringify({
                        tavilyApiKey: key,
                        proxy: currentProxyPayload()
                    })
                });
                if (data.ok) {
                    state.tavilyTest = { state: 'ok', msg: tf('setup.s4.tavily.ok', data.latencyMs ?? 0) };
                } else if (data.error === 'tavily.key.invalid') {
                    state.tavilyTest = { state: 'err', msg: t('setup.s4.tavily.invalid') };
                } else {
                    state.tavilyTest = { state: 'err', msg: tf('setup.s4.tavily.fail', data.detail || data.error || '') };
                }
            } catch (e) {
                state.tavilyTest = { state: 'err', msg: e.message };
            }
            renderStepBody();
        }

        /* ==================== Step 5 ==================== */
        function buildSummaryRowsHtml() {
            const hasAcoust = isAcoustIdConfigured();
            const acoustVerified = state.sourceTest && !state.sourceTest.loading && state.sourceTest.acoustid && state.sourceTest.acoustid.ok;
            const models = activeModelCount();
            const hasTavily = (state.tavilyApiKey || '').trim().length > 0;

            const sourcesVal = (hasAcoust ? 'AcoustID · ' : '') + computedUserAgent();
            const sourcesBadge = acoustVerified
                ? `<span class="pill ok">${SVG.ok}${esc(t('setup.s5.tag.verified'))}</span>`
                : (hasAcoust
                    ? `<span class="pill ok">${SVG.ok}${esc(t('setup.s5.tag.configured'))}</span>`
                    : `<span class="pill warn">${SVG.warn}${esc(t('setup.s5.tag.skipped'))}</span>`);

            let aiVal = t('setup.s5.tag.notSet');
            let aiBadge = `<span class="pill">${esc(t('setup.s5.tag.skipped'))}</span>`;
            if (models > 0 || (state.webSearchProvider === 'tavily' && hasTavily)) {
                const parts = [];
                if (models > 0) parts.push(`${models} LLM`);
                if (state.webSearchProvider === 'tavily' && hasTavily) parts.push('Tavily');
                else if (state.webSearchProvider === 'native' && models > 0) parts.push('Native Search');
                aiVal = parts.join(' · ');
                aiBadge = `<span class="pill ok">${SVG.ok}${esc(t('setup.s5.tag.configured'))}</span>`;
            }

            const policyParts = [
                state.reviewEnabled ? t('setup.s5.policy.review.title') : t('setup.s5.policy.auto.title')
            ];
            if ((state.releaseCountryPriority || '').trim()) policyParts.push(state.releaseCountryPriority.trim());

            const monOk = !state.dirStatus.monitor || state.dirStatus.monitor.status === 'ok';

            return `
                <div class="summary-row">
                    <div class="summary-k">${esc(t('setup.s5.sum.admin'))}</div>
                    <div class="summary-v mono">${esc(state.username)}</div>
                    <span class="pill ok">${SVG.ok}${esc(t(state.isRerun ? 'setup.s5.tag.existing' : 'setup.s5.tag.created'))}</span>
                </div>
                <div class="summary-row">
                    <div class="summary-k">${esc(t('setup.s5.sum.dirs'))}</div>
                    <div class="summary-v mono" title="${esc(state.monitorDirectory + ' -> ' + state.outputDirectory)}">${esc(state.monitorDirectory)} → ${esc(state.outputDirectory)}</div>
                    <span class="pill ${monOk ? 'ok' : 'warn'}">${monOk ? SVG.ok : SVG.warn}${esc(t('setup.s5.tag.ready'))}</span>
                </div>
                <div class="summary-row">
                    <div class="summary-k">${esc(t('setup.s5.sum.proxy'))}</div>
                    <div class="summary-v mono">${state.proxyEnabled ? esc(`${state.proxyHost}:${state.proxyPort}`) : esc(t('setup.s5.tag.direct'))}</div>
                    <span class="pill ${state.proxyEnabled ? 'info' : ''}">${esc(t(state.proxyEnabled ? 'setup.s5.tag.proxyOn' : 'setup.s5.tag.direct'))}</span>
                </div>
                <div class="summary-row">
                    <div class="summary-k">${esc(t('setup.s5.sum.sources'))}</div>
                    <div class="summary-v mono" title="${esc(sourcesVal)}">${esc(sourcesVal)}</div>
                    ${sourcesBadge}
                </div>
                <div class="summary-row">
                    <div class="summary-k">${esc(t('setup.s5.sum.ai'))}</div>
                    <div class="summary-v">${esc(aiVal)}</div>
                    ${aiBadge}
                </div>
                <div class="summary-row">
                    <div class="summary-k">${esc(t('setup.s5.sum.policy'))}</div>
                    <div class="summary-v">${esc(policyParts.join(' · '))}</div>
                    <span class="pill ok">${SVG.ok}${esc(t('setup.s5.tag.ready'))}</span>
                </div>`;
        }

        function tplStep5() {
            const restartFields = state.isRerun ? getRerunRestartFields() : [];
            return `
                <h1 class="step-title">${esc(t('setup.s5.title'))}</h1>
                <p class="step-desc">${esc(t('setup.s5.desc'))}</p>

                ${state.completeError ? `<div class="notice err" style="margin-top:16px;">${SVG.err}<div class="notice-body">${esc(state.completeError)}</div></div>` : ''}

                <div class="section-heading"><span>${esc(t('setup.s5.policy.head'))}</span></div>
                <div class="choice-grid" role="radiogroup">
                    <div class="choice-card ${state.reviewEnabled ? 'selected' : ''}" role="radio" tabindex="0"
                        aria-checked="${state.reviewEnabled}"
                        onclick="state.reviewEnabled = true; saveDraft(); renderStepBody()"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();state.reviewEnabled=true;saveDraft();renderStepBody();}">
                        <div class="choice-head">
                            <span class="choice-radio"></span>
                            <span>${esc(t('setup.s5.policy.review.title'))}</span>
                        </div>
                        <div class="choice-desc">${esc(t('setup.s5.policy.review.desc'))}</div>
                    </div>
                    <div class="choice-card ${!state.reviewEnabled ? 'selected' : ''}" role="radio" tabindex="0"
                        aria-checked="${!state.reviewEnabled}"
                        onclick="state.reviewEnabled = false; saveDraft(); renderStepBody()"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();state.reviewEnabled=false;saveDraft();renderStepBody();}">
                        <div class="choice-head">
                            <span class="choice-radio"></span>
                            <span>${esc(t('setup.s5.policy.auto.title'))}</span>
                        </div>
                        <div class="choice-desc">${esc(t('setup.s5.policy.auto.desc'))}</div>
                    </div>
                </div>

                <div class="section-heading"><span>${esc(t('setup.s5.opts.head'))}</span></div>
                <div style="display:grid;gap:10px;">
                    <div class="checkbox-row">
                        <input id="chkCovRev" type="checkbox" ${state.coverMissingRequireReview ? 'checked' : ''}
                            onchange="state.coverMissingRequireReview = this.checked; saveDraft()">
                        <label for="chkCovRev">${esc(t('setup.s5.opt.coverReview'))}</label>
                    </div>
                    <div class="checkbox-row">
                        <input id="chkAnime" type="checkbox" ${state.preferAnimeCover ? 'checked' : ''}
                            onchange="state.preferAnimeCover = this.checked; saveDraft()">
                        <label for="chkAnime">${esc(t('setup.s5.opt.animeCover'))}</label>
                    </div>
                    <div class="checkbox-row">
                        <input id="chkLrc" type="checkbox" ${state.exportLyricsToFile ? 'checked' : ''}
                            onchange="state.exportLyricsToFile = this.checked; saveDraft()">
                        <label for="chkLrc">${esc(t('setup.s5.opt.lrc'))}</label>
                    </div>
                </div>

                <div class="form-row" style="margin-top: 14px;">
                    <label for="inRegion">${esc(t('setup.s5.region.label'))}</label>
                    <input id="inRegion" type="text" class="mono-input" placeholder="${esc(t('setup.s5.region.ph'))}"
                        value="${esc(state.releaseCountryPriority)}"
                        oninput="state.releaseCountryPriority = this.value; saveDraft()">
                    <div class="chip-row">
                        <button type="button" class="chip-btn" onclick="setRegion('JP,US,GB')">JP,US,GB</button>
                        <button type="button" class="chip-btn" onclick="setRegion('US,GB,XW')">US,GB,XW</button>
                        <button type="button" class="chip-btn" onclick="setRegion('CN,TW,HK')">CN,TW,HK</button>
                        <button type="button" class="chip-btn" onclick="setRegion('')">${esc(t('setup.s5.region.clear'))}</button>
                    </div>
                </div>

                <div class="section-heading"><span>${esc(t('setup.s5.summary.head'))}</span></div>
                <div class="summary-list">${buildSummaryRowsHtml()}</div>

                ${!state.active ? `
                    <div class="notice info" style="margin-top: 16px;">
                        ${SVG.info}
                        <div class="notice-body">${esc(t('setup.s5.freshHint'))}</div>
                    </div>` : ''}

                ${state.rerunSavedNeedsRestart && state.rerunSavedNeedsRestart.length > 0 ? `
                    <div class="notice warn" style="margin-top: 16px;">
                        ${SVG.warn}
                        <div class="notice-body">
                            <div>${esc(tf('setup.s5.rerunRestartWarn', state.rerunSavedNeedsRestart.join(', ')))}</div>
                            <div class="notice-actions">
                                <button type="button" class="btn ghost sm" onclick="restartServiceNow()">${esc(t('setup.btn.restartNow'))}</button>
                                <a class="btn plain sm" href="index.html#settings">${esc(t('setup.btn.backSettings'))}</a>
                            </div>
                        </div>
                    </div>` : (restartFields.length > 0 ? `
                    <div class="notice warn" style="margin-top: 16px;">
                        ${SVG.warn}
                        <div class="notice-body">${esc(tf('setup.s5.rerunRestartWarn', restartFields.join(', ')))}</div>
                    </div>` : '')}
            `;
        }

        function setRegion(val) {
            state.releaseCountryPriority = val;
            saveDraft();
            renderStepBody();
        }

        async function finishSetup() {
            if (state.activating) return;
            state.activating = true;
            state.completeError = '';
            renderStepFooter();

            const configPayload = {
                language: state.lang,
                monitorDirectory: (state.monitorDirectory || '').trim(),
                outputDirectory: (state.outputDirectory || '').trim(),
                proxyEnabled: !!state.proxyEnabled,
                acoustIdApiKey: (state.acoustIdApiKey || '').trim(),
                userAgent: computedUserAgent(),
                webSearchProvider: state.webSearchProvider,
                tavilyApiKey: (state.tavilyApiKey || '').trim(),
                llmAlbumJudgeEnabled: !!state.llmAlbumJudgeEnabled,
                enableLLMMatching: !!state.enableLLMMatching,
                reviewEnabled: !!state.reviewEnabled,
                coverMissingRequireReview: !!state.coverMissingRequireReview,
                preferAnimeCover: !!state.preferAnimeCover,
                exportLyricsToFile: !!state.exportLyricsToFile,
                releaseCountryPriority: (state.releaseCountryPriority || '').trim()
            };
            if (state.proxyEnabled) {
                configPayload.proxyHost = (state.proxyHost || '').trim();
                configPayload.proxyPort = Number(state.proxyPort) || 0;
                configPayload.proxyUsername = (state.proxyUsername || '').trim();
                configPayload.proxyPassword = state.proxyPassword || '';
            }

            const body = { config: configPayload };
            if (state.providersDirty) {
                body.providers = state.llmProviders
                    .filter(p => (p.apiUrl || '').trim() || (p.apiKey || '').trim() || (p.models && p.models.length > 0))
                    .map(p => ({
                        id: p.id || '',
                        name: (p.name || '').trim(),
                        format: p.format === 'anthropic' ? 'anthropic' : 'openai',
                        apiUrl: (p.apiUrl || '').trim(),
                        apiKey: (p.apiKey || '').trim(),
                        enabled: p.enabled !== false,
                        models: (p.models || []).map(m => ({
                            id: (m.id || '').trim(),
                            enabled: m.enabled !== false,
                            webSearch: !!m.webSearch
                        })).filter(m => m.id)
                    }));
            }

            try {
                const data = await apiJson('/api/setup/complete', {
                    method: 'POST',
                    body: JSON.stringify(body)
                });
                clearDraft();
                state.activating = false;
                if (data.requiresRestart && Array.isArray(data.pendingRestartFields) && data.pendingRestartFields.length > 0) {
                    state.rerunSavedNeedsRestart = data.pendingRestartFields;
                    showToast(t('setup.toast.rerunSaved'));
                    renderWizard();
                    return;
                }
                location.href = state.isRerun ? 'index.html#settings' : 'index.html?setup=done';
            } catch (err) {
                state.activating = false;
                state.completeError = err.message || t('setup.error.activation.failed');
                renderWizard();
            }
        }

        async function restartServiceNow() {
            if (!confirm(t('control.restart.confirm'))) return;
            try {
                await apiJson('/api/control/restart', { method: 'POST' });
                showToast(t('control.restart.success'));
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function goToStep(n) {
            if (n === 1 && state.adminCreated) return;
            state.step = n;
            state.maxUnlocked = Math.max(state.maxUnlocked, n);
            state.skipConfirmOpen = false;
            saveDraft();
            renderWizard();
            if (n === 2 && !state.dirStatus.monitor) checkDirs();
        }

        function toggleEye(inputId, btn) {
            const el = document.getElementById(inputId);
            if (!el) return;
            const show = el.type === 'password';
            el.type = show ? 'text' : 'password';
            btn.innerHTML = show ? SVG.eyeOff : SVG.eye;
        }

        /* ==================== 启动初始化 ==================== */
        window.addEventListener('load', async () => {
            try {
                const params = new URLSearchParams(location.search);
                const wantRerun = params.get('mode') === 'rerun';

                const [statusResp, authResp] = await Promise.all([
                    fetch('/api/setup/status', { credentials: 'same-origin' }),
                    fetch('/api/auth/status', { credentials: 'same-origin' })
                ]);
                const statusData = statusResp.ok ? await statusResp.json() : {};
                const authData = authResp.ok ? await authResp.json() : {};

                let preferredLang = statusData.language || 'zh_CN';
                try {
                    const draft = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null');
                    if (draft && (draft.lang === 'zh_CN' || draft.lang === 'en_US')) preferredLang = draft.lang;
                } catch (e) { /* ignore */ }
                await loadI18n(preferredLang);

                if (statusData.environment) state.env = statusData.environment;
                state.active = !!statusData.active;
                state.authenticated = !!authData.authenticated;
                state.csrfToken = authData.csrfToken || null;
                state.username = authData.username || 'admin';

                if (statusData.setupCompleted) {
                    if (!wantRerun) {
                        location.replace('index.html');
                        return;
                    }
                    if (!state.authenticated) {
                        location.replace('index.html?next=setup-rerun');
                        return;
                    }
                    state.isRerun = true;
                    state.adminCreated = true;
                    await loadBootstrap();
                    state.step = 2;
                    state.maxUnlocked = 5;
                    document.getElementById('loadingView').style.display = 'none';
                    document.getElementById('wizardView').style.display = 'flex';
                    renderWizard();
                    checkDirs();
                    return;
                }

                // 未完成初始化
                if (statusData.needsAdmin) {
                    state.adminCreated = false;
                    state.step = 1;
                    state.maxUnlocked = 1;
                    document.getElementById('loadingView').style.display = 'none';
                    document.getElementById('wizardView').style.display = 'flex';
                    renderWizard();
                    return;
                }

                // 已建号但未完成初始化：未登录先去登录，已登录直接续配第 2 步
                if (!state.authenticated) {
                    location.replace('index.html?next=setup');
                    return;
                }

                state.adminCreated = true;
                await loadBootstrap();
                state.step = Math.max(2, Math.min(5, Number(state.step) || 2));
                state.maxUnlocked = Math.max(2, state.step);
                document.getElementById('loadingView').style.display = 'none';
                document.getElementById('wizardView').style.display = 'flex';
                renderWizard();
                checkDirs();
            } catch (e) {
                document.getElementById('loadingView').textContent = e.message || 'Failed to load setup wizard';
            }
        });
    </script>
</body>
</html>
