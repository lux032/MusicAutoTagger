<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待人工确认 - Music Auto Tagger</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="app.css?v=7">
    <style>
        .layout {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

        .queue-list { max-height: calc(100vh - 250px); overflow-y: auto; display: grid; gap: 10px; }

        .item {
            border: 1px solid var(--border);
            border-left: 3px solid var(--warn);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease, transform .15s ease;
            background: #fff;
        }
        .item:hover { background: var(--bg-soft); transform: translateX(2px); }
        .item.active { border-color: var(--primary); border-left-color: var(--primary); background: var(--primary-soft); }
        .item .name { font-weight: 600; word-break: break-all; font-size: 13.5px; }
        .item .meta { font-size: 12px; color: var(--text-mute); margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .item-signals { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
        .signal { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 600; background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }
        .signal.online { background: #eef6ff; color: #1d4ed8; border-color: #cfe1fb; }
        .signal.llm { background: #f5f0ff; color: #6d28d9; border-color: #ded0fb; }
        .signal.stale { background: #fff1f2; color: var(--danger); border-color: #fecdd3; }

        .detail-head {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 15px;
            font-weight: 700;
            word-break: break-all;
        }

        .detail-facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }
        .fact {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
        }
        .fact-label { font-size: 11.5px; color: var(--text-mute); }
        .fact-value { font-size: 13.5px; font-weight: 600; margin-top: 2px; word-break: break-all; }

        .section { margin-top: 22px; }
        .section-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding-left: 10px;
            border-left: 3px solid var(--primary);
        }

        .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .table-scroll { overflow-x: auto; }

        .panel {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            background: var(--bg-soft);
            margin: 10px 0;
        }
        .panel.accent { background: #f7faff; border-color: #dbe6fb; }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

        .diff-ok { color: var(--success); font-weight: 600; }
        .diff-bad { color: var(--danger); font-weight: 600; }

        details { margin-top: 8px; }
        summary { cursor: pointer; font-size: 12.5px; color: var(--primary); }
        .confidence-note { margin-top: 10px; padding: 9px 11px; border-radius: var(--radius-sm); background: #fffbea; border: 1px solid #f3df9b; color: #785b13; font-size: 12px; line-height: 1.6; }
        .track-match { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="topbar-main">
            <div class="brand">
                <img class="brand-logo" src="logo.png" alt="Music Auto Tagger">
                <div>
                    <div class="brand-title">待人工确认</div>
                    <div class="brand-subtitle">曲目已识别、专辑无法确定的文件夹，文件保持原样未写入标签</div>
                </div>
            </div>
        </div>
        <nav class="navbar">
            <button class="nav-toggle" onclick="document.getElementById('navGroup').classList.toggle('open')" aria-label="menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                菜单
            </button>
            <div class="nav-group" id="navGroup">
                <button class="nav-btn" onclick="loadList()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    刷新
                </button>
                <a class="nav-btn" href="recovery.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                    重新识别
                </a>
                <a class="nav-btn active" href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"></path><path d="M9 21V12h6v9"></path><path d="M5 10v11h14V10"></path></svg>
                    返回面板
                </a>
            </div>
        </nav>
    </header>

    <div class="layout">
        <section class="card">
            <div class="card-head section-underline">
                <div class="card-title">
                    <span class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    </span>
                    队列
                </div>
            </div>
            <div class="form-row" style="margin-bottom: 12px;">
                <select id="statusFilter" onchange="loadList()">
                    <option value="PENDING_REVIEW">待确认</option>
                    <option value="ALL">全部</option>
                    <option value="CONFIRMED">已确认</option>
                    <option value="ARCHIVED_UNVERIFIED">按未收录归档</option>
                    <option value="REJECTED">已忽略</option>
                </select>
            </div>
            <div class="queue-list" id="list"><div class="empty">加载中...</div></div>
        </section>

        <section class="card">
            <div class="card-head section-underline">
                <div class="card-title">
                    <span class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    </span>
                    详情
                </div>
            </div>
            <div id="detail"><div class="empty">请从左侧选择一个文件夹</div></div>
        </section>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <a href="https://032.im" target="_blank" rel="noopener">Lux032</a>
            <span class="footer-divider">|</span>
            <a href="https://github.com/lux032/MusicAutoTagger" target="_blank" rel="noopener">Music Auto Tagger</a>
        </div>
    </footer>
</div>
<!-- 确认联网候选：以前是五个连续的 prompt()，改成一个表单弹窗 -->
<div class="overlay" id="onlineDialog">
    <div class="dialog" style="width: min(520px, 96vw);">
        <div class="dialog-title">确认联网候选</div>
        <div class="dialog-subtitle">所有文件先写入工作目录，全部成功后才原子提交归档。</div>
        <div class="dialog-stack">
            <div class="form-row">
                <label for="ocTitle">最终专辑名</label>
                <input id="ocTitle" type="text">
            </div>
            <div class="form-row">
                <label for="ocArtist">最终专辑艺术家</label>
                <input id="ocArtist" type="text">
            </div>
            <div class="form-row">
                <label for="ocDate">发行日期</label>
                <input id="ocDate" type="text" placeholder="保留来源精度，可留空">
            </div>
            <div class="form-row">
                <label for="ocEdition">版本信息</label>
                <input id="ocEdition" type="text" placeholder="与专辑名分开保存，可留空">
            </div>
            <div class="form-row">
                <label for="ocDir">归档目录名</label>
                <input id="ocDir" type="text" placeholder="留空则自动生成">
            </div>
        </div>
        <div class="dialog-actions">
            <button class="btn ghost" onclick="closeOnlineDialog()">取消</button>
            <button class="btn primary" onclick="submitOnlineConfirm()">确认归档</button>
        </div>
    </div>
</div>

<!-- 标记失败 / 忽略 -->
<div class="overlay" id="rejectDialog">
    <div class="dialog">
        <div class="dialog-title">标记失败 / 忽略</div>
        <div class="dialog-subtitle">不写标签、不归档，仅记录以避免下一轮扫描反复重试。</div>
        <div class="form-row">
            <label for="rejectNote">备注（可留空）</label>
            <input id="rejectNote" type="text">
        </div>
        <div class="dialog-actions">
            <button class="btn ghost" onclick="closeRejectDialog()">取消</button>
            <button class="btn danger" onclick="submitReject()">确认忽略</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let csrfToken = null;
    let currentId = null;

    async function init() {
        try {
            const resp = await fetch('/api/auth/status');
            const data = await resp.json();
            if (!data.authenticated) {
                document.body.innerHTML = '<div class="app" style="max-width: 460px; margin-top: 12vh;">'
                    + '<div class="card"><div class="empty">未登录，请先在 <a href="/index.html">主面板</a> 登录。</div></div></div>';
                return;
            }
            csrfToken = data.csrfToken;
        } catch (e) {
            toast('无法获取登录状态: ' + e.message);
            return;
        }
        loadList();
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    async function api(path, options = {}) {
        options.headers = options.headers || {};
        if (csrfToken) options.headers['X-CSRF-Token'] = csrfToken;
        if (options.body) options.headers['Content-Type'] = 'application/json';
        const resp = await fetch(path, options);
        let data = {};
        try { data = await resp.json(); } catch (e) { /* ignore */ }
        if (!resp.ok) {
            throw new Error(data.error || ('HTTP ' + resp.status));
        }
        return data;
    }

    // 后端错误码 -> 人话。GET（展开）与 POST（处置）共用。
    const ERROR_MESSAGES = {
        'item.already.resolved': '该条目已被处置过（可能是重复提交）',
        'files.missing': '有原始文件已不存在，为避免只归档一部分，已拒绝本次处理',
        'candidate.not.found': '找不到所选候选',
        'release.id.required': '请先展开版本明细，并选择一个具体的 Release',
        'csrf.invalid': '会话已失效，请重新登录',
        'candidates.expand.failed': '候选版本尚未成功展开（MusicBrainz 可能暂时不可用），请点「展开版本明细」重试后再操作',
        'llm.judge.disabled': 'LLM 判定未启用（llm.album.judge.enabled=false）',
        'llm.not.configured': '未配置可用的 LLM（llm.apiKey / llm.apiUrl / llm.model）',
        'llm.call.failed': 'LLM 调用失败，请检查网络、API Key 与协议配置'
    };

    function humanError(message) {
        return ERROR_MESSAGES[message] || message;
    }

    function statusBadge(status) {
        const map = {
            PENDING_REVIEW: ['pending', '待确认'],
            CONFIRMED: ['confirmed', '已确认'],
            ARCHIVED_UNVERIFIED: ['unverified', '未收录归档'],
            REJECTED: ['rejected', '已忽略']
        };
        const [cls, text] = map[status] || ['', status];
        return `<span class="badge ${cls}">${text}</span>`;
    }

    async function loadList() {
        const status = document.getElementById('statusFilter').value;
        const listEl = document.getElementById('list');
        try {
            const data = await api('/api/review/list?status=' + encodeURIComponent(status));
            if (!data.items || data.items.length === 0) {
                listEl.innerHTML = '<div class="empty">没有条目</div>';
                return;
            }
            listEl.innerHTML = data.items.map(item => {
                const localConfidence = item.localEvidenceAvailable && validScore(item.confidence)
                    ? percent(item.confidence) : null;
                const onlineCount = item.onlineCandidateCount || 0;
                const llm = item.llmSuggestion;
                return `
                <div class="item ${item.id === currentId ? 'active' : ''}" onclick="openItem('${item.id}')">
                    <div class="name">${escapeHtml(item.folderName || '')}</div>
                    <div class="meta">
                        ${statusBadge(item.status)}
                        <span>${item.fileCount} 个文件 · 本地候选 ${item.candidateCount} 个</span>
                    </div>
                    <div class="item-signals">
                        ${localConfidence === null ? '' : `<span class="signal">本地证据 ${localConfidence}</span>`}
                        ${onlineCount ? `<span class="signal online">联网候选 ${onlineCount} 个 · 最佳覆盖 ${percent(item.bestOnlineTrackCoverage)}</span>` : ''}
                        ${llm ? `<span class="signal llm">LLM 建议 ${percent(llm.confidence)}</span>` : ''}
                        ${item.onlineEvidenceStale ? '<span class="signal stale">联网证据已过期</span>' : ''}
                    </div>
                    <div class="meta">${escapeHtml(item.reason || '')}</div>
                </div>`;
            }).join('');
        } catch (e) {
            listEl.innerHTML = `<div class="empty">加载失败: ${escapeHtml(e.message)}</div>`;
        }
    }

    async function openItem(id, expand) {
        currentId = id;
        const detailEl = document.getElementById('detail');
        detailEl.innerHTML = '<div class="empty">加载中...</div>';
        try {
            const url = '/api/review/item?id=' + encodeURIComponent(id) + (expand ? '&expand=1' : '');
            const data = await api(url);
            renderDetail(data.item);
            loadList();
        } catch (e) {
            detailEl.innerHTML = `<div class="empty">加载失败: ${escapeHtml(humanError(e.message))}</div>`;
        }
    }

    function renderDetail(item) {
        const pending = item.status === 'PENDING_REVIEW';
        const candidateRows = (item.candidates || []).map(c => {
            const sim = c.durationSimilarity == null ? '-' : (c.durationSimilarity * 100).toFixed(1) + '%';
            const key = c.releaseId || '';
            const rg = c.releaseGroupId || '';
            const trackDelta = c.trackCount && item.fileCount
                ? (c.trackCount - item.fileCount) : null;
            const deltaText = trackDelta === null ? '' :
                `<span class="${Math.abs(trackDelta) <= 1 ? 'diff-ok' : 'diff-bad'}">(${trackDelta >= 0 ? '+' : ''}${trackDelta})</span>`;
            // 只有展开到具体 Release（有 releaseId）才能确认：
            // 仅 Release Group 级则拿不到磟号/曲目号/发行日期，确认也是残缺的。
            // 后端同样做了硬校验，这里只是避免误导。
            const confirmCell = !pending ? ''
                : (key
                    ? `<button class="btn primary sm" onclick="confirmCandidate('${key}','${rg}')">确认</button>`
                    : `<span class="hint">需先展开版本明细</span>`);
            return `<tr>
                <td>${escapeHtml(c.title || '')}<div class="hint">${escapeHtml(c.releaseId || c.releaseGroupId || '')}</div></td>
                <td>${escapeHtml(c.mediaFormat || '-')}</td>
                <td>${c.trackCount || '-'} ${deltaText}</td>
                <td>${sim}</td>
                <td>${c.supportCount || 0}/${c.totalSamples || 0}</td>
                <td>${confirmCell}</td>
            </tr>`;
        }).join('');

        const llm = item.llmSuggestion;
        const llmBlock = !llm ? '' : `
            <div class="section">
                <div class="section-title">LLM 判定建议</div>
                <div class="panel">
                <div>${llm.choiceIndex > 0
                    ? '建议选择：<strong>' + escapeHtml(llm.suggestedTitle || '') + '</strong>'
                    : '建议：<strong>候选里都不是</strong>'
                    }${llm.unreleasedCompilation ? ' · 判定为 <strong>MusicBrainz 未收录的精选集/自制合辑</strong>' : ''}</div>
                <div class="hint">置信度 ${(llm.confidence * 100).toFixed(0)}% ·
                    模型 ${escapeHtml(llm.model || '')} (${escapeHtml(llm.provider || '')})
                    ${llm.applied ? '· <strong>已自动落盘</strong>' : '· 仅为建议，仍需人工确认'}</div>
                <div class="hint">理由：${escapeHtml(llm.reason || '')}</div>
                <div class="hint">
                    LLM 只被允许在上面的候选中选择或回答「都不是」，不会自行给出专辑名与年份，
                    因此它不会编造一张不存在的专辑；但它仍可能选错，请对照时长序列复核。
                </div>
                </div>
            </div>`;

        const onlineRows = (item.onlineCandidates || []).map(c => {
            const matchedTracks = (c.tracks || []).filter(t => (t.matchConfidence || 0) >= 0.6).length;
            const totalLocal = (item.files || []).length;
            const trackRows = (c.tracks || []).filter(t => t.matchedFilePath).map(t => `
                <div class="hint">${t.discNo || 1}-${t.trackNo || '-'} ${escapeHtml(t.title || '')}
                    → ${escapeHtml(baseName(t.matchedFilePath))} · 匹配 ${percent(t.matchConfidence)}</div>`).join('');
            return `<div class="panel accent">
            <div><strong>${escapeHtml(c.title || '')}</strong>${c.edition ? ' · ' + escapeHtml(c.edition) : ''}</div>
            <div class="hint">${escapeHtml(c.albumArtist || c.artist || '')} · ${escapeHtml(c.releaseDate || '日期未知')}</div>
            <div class="item-signals">
                <span class="signal online">搜索来源自评 ${percent(c.confidence)}</span>
                <span class="signal">可靠逐曲匹配 ${matchedTracks}/${totalLocal}</span>
                <span class="signal">本地覆盖率 ${percent(c.trackCoverage)}</span>
            </div>
            <div class="hint">${escapeHtml(c.reason || '')}</div>
            <div class="hint">曲目表 ${(c.tracks||[]).length} 首 · 来源 ${(c.sources||[]).length} 个</div>
            ${trackRows ? `<details class="track-match"><summary>查看逐曲匹配明细</summary>${trackRows}</details>` : ''}
            ${(c.sources||[]).map(s=>`<div class="hint">[${escapeHtml(s.reliability||'')}] ${linkOrText(s.url, s.title||s.domain||s.url)}${s.snippet?' — '+escapeHtml(s.snippet):''}</div>`).join('')}
            ${safeUrl(c.coverUrl)?`<div class="hint">联网封面：${linkOrText(c.coverUrl,'预览')}（确认时默认不自动使用）</div>`:''}
            ${pending && !item.onlineEvidenceStale ? `<button class="btn primary sm" style="margin-top:10px" onclick='confirmOnline(${JSON.stringify(c.id)},${JSON.stringify(c.title||'')},${JSON.stringify(c.albumArtist||c.artist||'')},${JSON.stringify(c.releaseDate||'')},${JSON.stringify(c.edition||'')})'>确认联网候选</button>` : ''}
        </div>`;
        }).join('');

        const fileRows = (item.files || []).map(f => `<tr>
            <td>${escapeHtml(f.fileName || '')}</td>
            <td>${escapeHtml(f.title || '')}</td>
            <td>${escapeHtml(f.artist || '')}</td>
            <td>${f.duration == null ? '-' : formatDuration(f.duration)}</td>
        </tr>`).join('');

        document.getElementById('detail').innerHTML = `
            <div class="detail-head">
                <span>${escapeHtml(item.folderName || '')}</span> ${statusBadge(item.status)}
            </div>
            <div class="hint">${escapeHtml(item.folderPath || '')}</div>
            <div class="hint">${escapeHtml(item.reason || '')}</div>
            <div class="detail-facts">
                <div class="fact">
                    <div class="fact-label">合成专辑名</div>
                    <div class="fact-value">${escapeHtml(item.synthesizedAlbumTitle || '-')}</div>
                </div>
                <div class="fact">
                    <div class="fact-label">合成专辑艺术家</div>
                    <div class="fact-value">${escapeHtml(item.synthesizedAlbumArtist || '-')}</div>
                </div>
                <div class="fact">
                    <div class="fact-label">本地证据可用度</div>
                    <div class="fact-value">${item.localEvidenceAvailable && validScore(item.confidence) ? percent(item.confidence) : '不适用'}</div>
                </div>
            </div>
            <div class="confidence-note">
                本页存在多套不同含义的分数，不能横向直接比较：本地证据可用度表示已有曲目元数据覆盖情况；
                MusicBrainz 时长相似度表示官方时长序列吻合程度；LLM 建议置信度与联网来源自评都来自模型；
                联网本地覆盖率和逐曲匹配分数才是联网候选与当前文件的实际匹配证据。
            </div>

            ${(item.candidates || []).length ? `<div class="section">
                <div class="section-title">
                    MusicBrainz 候选专辑
                    ${item.candidatesExpanded ? '' :
                        `<button class="btn ghost sm" onclick="openItem('${item.id}', true)">从 MusicBrainz 展开版本明细</button>
                         <span class="hint">（展开失败时可重复点击重试）</span>`}
                </div>
                ${candidateRows ? `<div class="table-wrap table-scroll"><table class="table">
                    <thead><tr><th>专辑</th><th>格式</th><th>曲目数</th><th>时长相似度</th><th>样本支持</th><th></th></tr></thead>
                    <tbody>${candidateRows}</tbody></table></div>`
                    : '<div class="empty">没有候选</div>'}
                <div class="hint">
                    「时长相似度」是文件夹时长序列与该版本官方时长序列的 DTW 相似度，是最强的判断依据。
                    展开明细会调用 MusicBrainz，可能需要几秒。
                </div>
            </div>` : ''}

            ${llmBlock}

            ${(item.onlineCandidates||[]).length || (item.onlineClues||[]).length ? `<div class="section">
                <div class="section-title">联网搜索候选 ${item.onlineEvidenceStale ? '<span class="badge rejected">证据已过期</span>' : ''}</div>
                <div class="hint">提供商 ${escapeHtml(item.onlineSearchProvider||'')} · 模型 ${escapeHtml(item.onlineSearchModel||'')} · 检索时间 ${item.onlineSearchedAt?new Date(item.onlineSearchedAt).toLocaleString():'-'}</div>
                ${onlineRows || '<div class="empty">未找到满足来源门槛的正式候选</div>'}
                ${(item.onlineClues||[]).length ? `<details><summary>查看其他搜索线索（${item.onlineClues.length}）— 未达来源门槛，仅供参考</summary>${item.onlineClues.map(s=>`<div class="hint">${linkOrText(s.url, s.title||s.url||'线索')}</div>`).join('')}</details>`:''}
            </div>` : ''}

            <div class="section">
                <div class="section-title">文件（${(item.files || []).length}）</div>
                <div class="table-wrap table-scroll"><table class="table">
                    <thead><tr><th>文件名</th><th>识别曲目</th><th>艺术家</th><th>时长</th></tr></thead>
                    <tbody>${fileRows}</tbody>
                </table></div>
            </div>

            <div class="actions">
                ${item.llmJudgeEnabled ? `<button class="btn ghost" ${pending ? '' : 'disabled'} onclick="llmJudge()">
                    让 LLM 判定（封闭选择题）
                </button>` : ''}
                <button class="btn info" ${pending ? '' : 'disabled'} onclick="archiveItem()">
                    按「MusicBrainz 未收录」归档
                </button>
                <button class="btn danger" ${pending ? '' : 'disabled'} onclick="rejectItem()">
                    标记失败 / 忽略
                </button>
            </div>
            <div class="hint" style="margin-top: 12px;">
                · 「确认」：按选定版本锁定整张专辑并归档（优先级最高，后续自动流程不会再改写）<br>
                · 「按未收录归档」：使用上面的合成专辑名归档，年份留空，标记为未验证<br>
                · 「标记失败 / 忽略」：不写标签、不归档，仅记录以避免下一轮扫描反复重试
            </div>
            ${item.resolutionNote ? `<div class="hint">处置结果：${escapeHtml(item.resolutionNote)}</div>` : ''}
        `;
    }

    let pendingOnlineCandidateId = null;

    function confirmOnline(candidateId, title, artist, releaseDate, edition) {
        if (!currentId) return;
        pendingOnlineCandidateId = candidateId;
        document.getElementById('ocTitle').value = title || '';
        document.getElementById('ocArtist').value = artist || '';
        document.getElementById('ocDate').value = releaseDate || '';
        document.getElementById('ocEdition').value = edition || '';
        document.getElementById('ocDir').value = '';
        document.getElementById('onlineDialog').classList.add('show');
    }

    function closeOnlineDialog() {
        document.getElementById('onlineDialog').classList.remove('show');
        pendingOnlineCandidateId = null;
    }

    async function submitOnlineConfirm() {
        if (!currentId || pendingOnlineCandidateId === null) return;
        const payload = {
            id: currentId,
            candidateId: pendingOnlineCandidateId,
            albumTitle: document.getElementById('ocTitle').value.trim(),
            albumArtist: document.getElementById('ocArtist').value.trim(),
            releaseDate: document.getElementById('ocDate').value.trim(),
            edition: document.getElementById('ocEdition').value.trim(),
            archiveDirectoryName: document.getElementById('ocDir').value.trim()
        };
        if (!payload.albumTitle) {
            toast('专辑名不能为空');
            return;
        }
        closeOnlineDialog();
        await runAction('/api/review/online-confirm', payload);
    }

    async function confirmCandidate(releaseId, releaseGroupId) {
        if (!currentId) return;
        if (!confirm('确认按该版本锁定并归档整个文件夹？此操作会写入标签并移动文件。')) return;
        await runAction('/api/review/confirm', { id: currentId, releaseId, releaseGroupId });
    }

    async function llmJudge() {
        if (!currentId) return;
        // 会先从 MusicBrainz 展开版本明细再调用模型，可能需要十几秒
        toast('正在调用 LLM 判定，请稍候...');
        await runAction('/api/review/llm', { id: currentId });
    }

    async function archiveItem() {
        if (!currentId) return;
        if (!confirm('按「MusicBrainz 未收录」归档？将使用合成的专辑信息，年份留空。')) return;
        await runAction('/api/review/archive', { id: currentId });
    }

    function rejectItem() {
        if (!currentId) return;
        document.getElementById('rejectNote').value = '';
        document.getElementById('rejectDialog').classList.add('show');
    }

    function closeRejectDialog() {
        document.getElementById('rejectDialog').classList.remove('show');
    }

    async function submitReject() {
        if (!currentId) return;
        const note = document.getElementById('rejectNote').value;
        closeRejectDialog();
        await runAction('/api/review/reject', { id: currentId, note });
    }

    async function runAction(path, body) {
        try {
            const data = await api(path, { method: 'POST', body: JSON.stringify(body) });
            // 部分失败时后端会把条目保留在 PENDING_REVIEW，不能报「成功」
            if (data.item && data.item.status === 'PENDING_REVIEW') {
                if (data.item.llmSuggestion && !data.item.llmSuggestion.applied
                    && path === '/api/review/llm') {
                    toast('LLM 判定完成，结论仅供参考，请人工确认');
                } else if (path === '/api/review/llm') {
                    toast('LLM 判定完成');
                } else {
                    toast('处理未全部成功，条目仍在待确认：' + (data.item.resolutionNote || ''));
                }
            } else {
                toast('操作成功');
            }
            renderDetail(data.item);
            loadList();
        } catch (e) {
            toast('操作失败: ' + humanError(e.message));
        }
    }

    function validScore(value) {
        return Number.isFinite(Number(value)) && Number(value) >= 0 && Number(value) <= 1;
    }

    function percent(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return '-';
        return (Math.max(0, Math.min(1, n)) * 100).toFixed(0) + '%';
    }

    function baseName(path) {
        return String(path || '').split(/[\\/]/).pop() || '';
    }

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return m + ':' + String(s).padStart(2, '0');
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 联网候选里的 URL 可能直接来自模型输出，只放行 http/https，挡住 javascript: 等协议
    function safeUrl(url) {
        const raw = String(url == null ? '' : url).trim();
        if (!/^https?:\/\//i.test(raw)) return null;
        return escapeHtml(raw);
    }

    function linkOrText(url, label) {
        const href = safeUrl(url);
        const text = escapeHtml(label || url || '来源');
        return href ? `<a href="${href}" target="_blank" rel="noopener">${text}</a>` : text;
    }

    // ESC 关闭任意弹窗
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeOnlineDialog();
            closeRejectDialog();
        }
    });

    // 点击遮罩层空白处关闭
    document.querySelectorAll('.overlay').forEach(el => {
        el.addEventListener('mousedown', (e) => {
            if (e.target === el) el.classList.remove('show');
        });
    });

    init();
</script>
</body>
</html>
