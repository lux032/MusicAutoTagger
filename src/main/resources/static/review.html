<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title-key="review.page.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待人工确认 - Music Auto Tagger</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="app.css?v=8">
    <script src="i18n.js?v=1"></script>
    <style>
        .layout {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

        .queue-list { max-height: calc(100vh - 250px); overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

        .item {
            border: 1px solid var(--border);
            border-left: 3px solid var(--warn);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease, transform .15s ease;
            background: #fff;
        }
        .item:hover { background: var(--bg-soft); transform: translateX(2px); }
        .item.active { border-color: var(--primary); border-left-color: var(--primary); background: var(--primary-soft); }
        .item .name { font-weight: 600; word-break: break-all; font-size: 13.5px; }
        .item .meta { font-size: 12px; color: var(--text-mute); margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .item-signals { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
        .signal { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 600; background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }
        .signal.online { background: #eef6ff; color: #1d4ed8; border-color: #cfe1fb; }
        .signal.llm { background: #f5f0ff; color: #6d28d9; border-color: #ded0fb; }
        .signal.stale { background: #fff1f2; color: var(--danger); border-color: #fecdd3; }

        .detail-head {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 15px;
            font-weight: 700;
            word-break: break-all;
        }

        .detail-facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }
        .fact {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
        }
        .fact-label { font-size: 11.5px; color: var(--text-mute); }
        .fact-value { font-size: 13.5px; font-weight: 600; margin-top: 2px; word-break: break-all; }

        .cover-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-top:8px; }
        .cover-choice { border:2px solid var(--border); border-radius:8px; padding:7px; cursor:pointer; background:#fff; }
        .cover-choice.selected { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
        .cover-choice img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:5px; background:var(--bg-soft); }
        .cover-meta { font-size:11px; color:var(--text-mute); margin-top:5px; word-break:break-word; }
        .section { margin-top: 22px; }
        .section-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding-left: 10px;
            border-left: 3px solid var(--primary);
        }

        .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .table-scroll { overflow-x: auto; }

        .panel {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            background: var(--bg-soft);
            margin: 10px 0;
        }
        .panel.accent { background: #f7faff; border-color: #dbe6fb; }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
        .suggestion-card { margin-top: 14px; padding: 16px; border: 1px solid #cbdcf8; border-left: 4px solid var(--primary); border-radius: var(--radius); background: #f7faff; }
        .suggestion-card.conflict { border-left-color: var(--warn); background: #fffbea; }
        .suggestion-card.archive { border-left-color: var(--danger); background: #fff7f7; }
        .suggestion-title { font-size: 12px; color: var(--text-mute); font-weight: 700; }
        .suggestion-conclusion { margin-top: 5px; font-size: 15px; font-weight: 700; }
        .suggestion-signals { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .suggestion-primary { margin-top: 12px; }
        .online-search-recommended { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); font-weight: 700; }
        .more-actions { width: 100%; margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--border); }
        .more-actions summary { font-weight: 600; }
        .more-actions-body { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .rejected-shortcut { cursor: pointer; border: 0; }

        .diff-ok { color: var(--success); font-weight: 600; }
        .diff-bad { color: var(--danger); font-weight: 600; }

        details { margin-top: 8px; }
        summary { cursor: pointer; font-size: 12.5px; color: var(--primary); }
        .confidence-note { margin-top: 10px; padding: 9px 11px; border-radius: var(--radius-sm); background: #fffbea; border: 1px solid #f3df9b; color: #785b13; font-size: 12px; line-height: 1.6; }
        .track-match { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="topbar-main">
            <div class="brand">
                <img class="brand-logo" src="logo.png" alt="Music Auto Tagger">
                <div>
                    <div class="brand-title" data-i18n="review.page.title">待人工确认</div>
                    <div class="brand-subtitle" data-i18n="review.page.subtitle">曲目已识别、专辑无法确定的文件夹，文件保持原样未写入标签</div>
                </div>
            </div>
        </div>
        <nav class="navbar">
            <button class="nav-toggle" onclick="document.getElementById('navGroup').classList.toggle('open')" aria-label="menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                <span data-i18n="web.menu">菜单</span>
            </button>
            <div class="nav-group" id="navGroup">
                <button class="nav-btn" onclick="loadList()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    <span data-i18n="review.nav.refresh">刷新</span>
                </button>
                <a class="nav-btn" href="recovery.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                    <span data-i18n="web.recovery">重新识别</span>
                </a>
                <a class="nav-btn active" href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"></path><path d="M9 21V12h6v9"></path><path d="M5 10v11h14V10"></path></svg>
                    <span data-i18n="review.nav.back">返回面板</span>
                </a>
            </div>
        </nav>
    </header>

    <div class="layout">
        <section class="card">
            <div class="card-head section-underline">
                <div class="card-title">
                    <span class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    </span>
                    <span data-i18n="review.queue">队列</span>
                </div>
            </div>
            <div class="form-row" style="margin-bottom: 12px;">
                <div class="filter-row">
                    <select id="statusFilter" onchange="loadList()">
                        <option value="PENDING_REVIEW" data-i18n="review.filter.pending">待确认</option>
                        <option value="ALL" data-i18n="review.filter.all">全部</option>
                        <option value="CONFIRMED" data-i18n="review.filter.confirmed">已确认</option>
                        <option value="ARCHIVED_UNVERIFIED" data-i18n="review.filter.archived">按未收录归档</option>
                        <option value="REJECTED" data-i18n="review.filter.rejected">已忽略</option>
                    </select>
                    <button class="badge rejected rejected-shortcut" id="rejectedShortcut" onclick="showRejected()"></button>
                </div>
            </div>
            <div class="queue-list" id="list"><div class="empty" data-i18n="review.loading">加载中...</div></div>
        </section>

        <section class="card">
            <div class="card-head section-underline">
                <div class="card-title">
                    <span class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    </span>
                    <span data-i18n="review.detail">详情</span>
                </div>
            </div>
            <div id="detail"><div class="empty" data-i18n="review.select.folder">请从左侧选择一个文件夹</div></div>
        </section>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <a href="https://032.im" target="_blank" rel="noopener">Lux032</a>
            <span class="footer-divider">|</span>
            <a href="https://github.com/lux032/MusicAutoTagger" target="_blank" rel="noopener">Music Auto Tagger</a>
        </div>
    </footer>
</div>
<!-- 确认联网候选：以前是五个连续的 prompt()，改成一个表单弹窗 -->
<div class="overlay" id="onlineDialog">
    <div class="dialog" style="width: min(520px, 96vw);">
        <div class="dialog-title" data-i18n="review.online.dialog.title">确认联网候选</div>
        <div class="dialog-subtitle" data-i18n="review.online.dialog.subtitle">所有文件先写入工作目录，全部成功后才原子提交归档。</div>
        <div class="dialog-stack">
            <div class="form-row">
                <label for="ocTitle" data-i18n="review.online.title">最终专辑名</label>
                <input id="ocTitle" type="text">
            </div>
            <div class="form-row">
                <label for="ocArtist" data-i18n="review.online.artist">最终专辑艺术家</label>
                <input id="ocArtist" type="text">
            </div>
            <div class="form-row">
                <label for="ocDate" data-i18n="review.online.date">发行日期</label>
                <input id="ocDate" type="text" placeholder="保留来源精度，可留空" data-i18n-placeholder="review.online.date.placeholder">
            </div>
            <div class="form-row">
                <label for="ocEdition" data-i18n="review.online.edition">版本信息</label>
                <input id="ocEdition" type="text" placeholder="与专辑名分开保存，可留空" data-i18n-placeholder="review.online.edition.placeholder">
            </div>
            <div class="form-row">
                <label for="ocDir" data-i18n="review.online.dir">归档目录名</label>
                <input id="ocDir" type="text" placeholder="留空则自动生成" data-i18n-placeholder="review.online.dir.placeholder">
            </div>
            <div class="form-row">
                <label data-i18n="review.online.cover.choose">选择要嵌入的封面</label>
                <button class="btn ghost sm" type="button" onclick="chooseNoCover()" data-i18n="review.online.cover.none">不使用封面</button>
                <div id="coverChoices" class="cover-grid"><span class="hint" data-i18n="review.online.cover.loading">正在加载可用封面…</span></div>
            </div>

        <div class="dialog-actions">
            <button class="btn ghost" onclick="closeOnlineDialog()" data-i18n="web.cancel">取消</button>
            <button class="btn primary" onclick="submitOnlineConfirm()" data-i18n="review.online.submit">确认归档</button>
        </div>
    </div>
</div>

<!-- 标记失败 / 忽略 -->
<div class="overlay" id="rejectDialog">
    <div class="dialog">
        <div class="dialog-title" data-i18n="review.reject.dialog.title">标记失败 / 忽略</div>
        <div class="dialog-subtitle" data-i18n="review.reject.dialog.subtitle">不写标签、不归档，仅记录以避免下一轮扫描反复重试。</div>
        <div class="form-row">
            <label for="rejectNote" data-i18n="review.reject.note">备注（可留空）</label>
            <input id="rejectNote" type="text">
        </div>
        <div class="dialog-actions">
            <button class="btn ghost" onclick="closeRejectDialog()" data-i18n="web.cancel">取消</button>
            <button class="btn danger" onclick="submitReject()" data-i18n="review.reject.submit">确认忽略</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let csrfToken = null;
    let currentId = null;
    let currentItem = null;
    let onlineSearchRunning = false;
    const t = (k, d) => I18n.t(k, d);
    const tf = (k, ...a) => I18n.tf(k, ...a);

    async function init() {
        await I18n.load();
        I18n.apply();
        try {
            const resp = await fetch('/api/auth/status');
            const data = await resp.json();
            if (!data.authenticated) {
                document.body.innerHTML = '<div class="app" style="max-width: 460px; margin-top: 12vh;">'
                    + '<div class="card"><div class="empty">' + escapeHtml(t('review.not.logged.in'))
                    + ' <a href="/index.html">' + escapeHtml(t('review.main.panel')) + '</a>.</div></div></div>';
                return;
            }
            csrfToken = data.csrfToken;
        } catch (e) {
            toast(t('review.auth.failed') + ': ' + e.message);
            return;
        }
        document.getElementById('rejectedShortcut').textContent = tf('review.filter.rejected.count', 0);
        loadList();
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    async function api(path, options = {}) {
        options.headers = options.headers || {};
        if (csrfToken) options.headers['X-CSRF-Token'] = csrfToken;
        if (options.body) options.headers['Content-Type'] = 'application/json';
        const resp = await fetch(path, options);
        let data = {};
        try { data = await resp.json(); } catch (e) { /* ignore */ }
        if (!resp.ok) {
            throw new Error(data.error || ('HTTP ' + resp.status));
        }
        return data;
    }

    // 后端错误码 -> 人话。GET（展开）与 POST（处置）共用。
    const ERROR_KEYS = {
        'item.already.resolved': 'review.error.already.resolved',
        'item.not.rejected': 'review.error.item.not.rejected',
        'folder.already.pending': 'review.error.folder.already.pending',
        'unreject.log.failed': 'review.error.unreject.log.failed',
        'files.missing': 'review.error.files.missing',
        'candidate.not.found': 'review.error.candidate.not.found',
        'release.id.required': 'review.error.release.required',
        'csrf.invalid': 'review.error.csrf',
        'candidates.expand.failed': 'review.error.expand.failed',
        'llm.judge.disabled': 'review.error.llm.disabled',
        'llm.not.configured': 'review.error.llm.not.configured',
        'llm.call.failed': 'review.error.llm.call.failed',
        'llm.web.search.unavailable': 'review.error.web.search.unavailable',
        'recovery.unavailable': 'review.error.recovery.unavailable',
        'recovery.already.running': 'review.error.online.already.running',
        'item.not.found': 'review.error.item.not.found',
        'recovery.no.audio.files': 'review.error.no.audio.files',
        'cover.selection.expired': 'review.error.cover.expired'
    };

    function humanError(message) {
        const key = ERROR_KEYS[message];
        return key ? t(key) : message;
    }

    function statusBadge(status) {
        const map = {
            PENDING_REVIEW: ['pending', 'review.status.pending'],
            CONFIRMED: ['confirmed', 'review.status.confirmed'],
            ARCHIVED_UNVERIFIED: ['unverified', 'review.status.archived'],
            REJECTED: ['rejected', 'review.status.rejected']
        };
        const entry = map[status];
        const cls = entry ? entry[0] : '';
        const text = entry ? t(entry[1]) : status;
        return `<span class="badge ${cls}">${escapeHtml(text)}</span>`;
    }

    async function loadRejectedCount() {
        try {
            const data = await api('/api/review/stats');
            document.getElementById('rejectedShortcut').textContent = tf('review.filter.rejected.count', data.rejected || 0);
        } catch (e) {
            // 列表本身仍可使用，统计快捷入口失败不覆盖主要错误信息。
        }
    }

    function showRejected() {
        document.getElementById('statusFilter').value = 'REJECTED';
        loadList();
    }

    async function loadList() {
        loadRejectedCount();
        const status = document.getElementById('statusFilter').value;
        const listEl = document.getElementById('list');
        try {
            const data = await api('/api/review/list?status=' + encodeURIComponent(status));
            if (!data.items || data.items.length === 0) {
                listEl.innerHTML = `<div class="empty">${escapeHtml(t('review.no.items'))}</div>`;
                return;
            }
            listEl.innerHTML = data.items.map(item => {
                const localConfidence = item.localEvidenceAvailable && validScore(item.confidence)
                    ? percent(item.confidence) : null;
                const onlineCount = item.onlineCandidateCount || 0;
                const llm = item.llmSuggestion;
                return `
                <div class="item ${item.id === currentId ? 'active' : ''}" onclick="openItem('${item.id}')">
                    <div class="name">${escapeHtml(item.folderName || '')}</div>
                    <div class="meta">
                        ${statusBadge(item.status)}
                        <span>${escapeHtml(tf('review.files.count', item.fileCount, item.candidateCount))}</span>
                    </div>
                    <div class="item-signals">
                        ${localConfidence === null ? '' : `<span class="signal">${escapeHtml(tf('review.signal.local', localConfidence))}</span>`}
                        ${onlineCount ? `<span class="signal online">${escapeHtml(tf('review.signal.online', onlineCount, percent(item.bestOnlineTrackCoverage)))}</span>` : ''}
                        ${llm ? `<span class="signal llm">${escapeHtml(tf('review.signal.llm', percent(llm.confidence)))}</span>` : ''}
                        ${item.onlineEvidenceStale ? `<span class="signal stale">${escapeHtml(t('review.signal.stale'))}</span>` : ''}
                    </div>
                    <div class="meta">${escapeHtml(item.reason || '')}</div>
                </div>`;
            }).join('');
        } catch (e) {
            listEl.innerHTML = `<div class="empty">${escapeHtml(t('review.load.failed'))}: ${escapeHtml(e.message)}</div>`;
        }
    }

    async function openItem(id, expand) {
        currentId = id;
        const detailEl = document.getElementById('detail');
        detailEl.innerHTML = `<div class="empty">${escapeHtml(t('review.loading'))}</div>`;
        try {
            const url = '/api/review/item?id=' + encodeURIComponent(id) + (expand ? '&expand=1' : '');
            const data = await api(url);
            renderDetail(data.item);
            loadList();
        } catch (e) {
            detailEl.innerHTML = `<div class="empty">${escapeHtml(t('review.load.failed'))}: ${escapeHtml(humanError(e.message))}</div>`;
        }
    }

    function renderDetail(item) {
        currentItem = item;
        const pending = item.status === 'PENDING_REVIEW';
        const suggestion = item.systemSuggestion || {};
        const primaryAction = suggestion.primaryAction || 'NONE';
        const searchRecommended = suggestion.level === 'TRY_ONLINE_SEARCH';
        const candidateRows = (item.candidates || []).map(c => {
            const sim = c.durationSimilarity == null ? '-' : (c.durationSimilarity * 100).toFixed(1) + '%';
            const key = c.releaseId || '';
            const rg = c.releaseGroupId || '';
            const trackDelta = c.trackCount && item.fileCount
                ? (c.trackCount - item.fileCount) : null;
            const deltaText = trackDelta === null ? '' :
                `<span class="${Math.abs(trackDelta) <= 1 ? 'diff-ok' : 'diff-bad'}">(${trackDelta >= 0 ? '+' : ''}${trackDelta})</span>`;
            // 只有展开到具体 Release（有 releaseId）才能确认：
            // 仅 Release Group 级则拿不到磟号/曲目号/发行日期，确认也是残缺的。
            // 后端同样做了硬校验，这里只是避免误导。
            const confirmCell = !pending ? ''
                : (key
                    ? `<button class="btn primary sm" onclick="confirmCandidate('${key}','${rg}')">${escapeHtml(t('review.confirm'))}</button>`
                    : `<span class="hint">${escapeHtml(t('review.need.expand'))}</span>`);
            return `<tr>
                <td>${escapeHtml(c.title || '')}<div class="hint">${escapeHtml(c.releaseId || c.releaseGroupId || '')}</div></td>
                <td>${escapeHtml(c.mediaFormat || '-')}</td>
                <td>${c.trackCount || '-'} ${deltaText}</td>
                <td>${sim}</td>
                <td>${c.supportCount || 0}/${c.totalSamples || 0}</td>
                <td>${confirmCell}</td>
            </tr>`;
        }).join('');

        const llm = item.llmSuggestion;
        const llmBlock = !llm ? '' : `
            <div class="section">
                <div class="section-title">${escapeHtml(t('review.llm.section'))}</div>
                <div class="panel">
                <div>${llm.choiceIndex > 0
                    ? escapeHtml(t('review.llm.suggest')) + ' <strong>' + escapeHtml(llm.suggestedTitle || '') + '</strong>'
                    : '<strong>' + escapeHtml(t('review.llm.none')) + '</strong>'
                    }${llm.unreleasedCompilation ? ' · <strong>' + escapeHtml(t('review.llm.unreleased')) + '</strong>' : ''}</div>
                <div class="hint">${escapeHtml(tf('review.llm.confidence', (llm.confidence * 100).toFixed(0) + '%'))} ·
                    ${escapeHtml(tf('review.llm.model', llm.model || '', llm.provider || ''))}
                    ${llm.applied ? '· <strong>' + escapeHtml(t('review.llm.applied')) + '</strong>' : '· ' + escapeHtml(t('review.llm.suggestion.only'))}</div>
                <div class="hint">${escapeHtml(tf('review.llm.reason', llm.reason || ''))}</div>
                <div class="hint">${escapeHtml(t('review.llm.note'))}</div>
                </div>
            </div>`;

        const onlineRows = (item.onlineCandidates || []).map(c => {
            const matchedTracks = (c.tracks || []).filter(t => (t.matchConfidence || 0) >= 0.6).length;
            const totalLocal = (item.files || []).length;
            const trackRows = (c.tracks || []).filter(t => t.matchedFilePath).map(t => `
                <div class="hint">${t.discNo || 1}-${t.trackNo || '-'} ${escapeHtml(t.title || '')}
                    → ${escapeHtml(baseName(t.matchedFilePath))} · ${escapeHtml(tf('review.match', percent(t.matchConfidence)))}</div>`).join('');
            return `<div class="panel accent">
            <div><strong>${escapeHtml(c.title || '')}</strong>${c.edition ? ' · ' + escapeHtml(c.edition) : ''}</div>
            <div class="hint">${escapeHtml(c.albumArtist || c.artist || '')} · ${escapeHtml(c.releaseDate || t('review.date.unknown'))}</div>
            <div class="item-signals">
                <span class="signal online">${escapeHtml(tf('review.signal.source.self', percent(c.confidence)))}</span>
                <span class="signal">${escapeHtml(tf('review.signal.reliable.match', matchedTracks, totalLocal))}</span>
                <span class="signal">${escapeHtml(tf('review.signal.local.coverage', percent(c.trackCoverage)))}</span>
            </div>
            <div class="hint">${escapeHtml(c.reason || '')}</div>
            <div class="hint">${escapeHtml(tf('review.tracklist.summary', (c.tracks||[]).length, (c.sources||[]).length))}</div>
            ${trackRows ? `<details class="track-match"><summary>${escapeHtml(t('review.track.match.detail'))}</summary>${trackRows}</details>` : ''}
            ${(c.sources||[]).map(s=>`<div class="hint">[${escapeHtml(s.reliability||'')}] ${linkOrText(s.url, s.title||s.domain||s.url)}${s.snippet?' — '+escapeHtml(s.snippet):''}</div>`).join('')}
            ${pending && !item.onlineEvidenceStale ? `<button class="btn primary sm" style="margin-top:10px" onclick='confirmOnline(${escapeHtml(JSON.stringify(c.id))},${escapeHtml(JSON.stringify(c.title||''))},${escapeHtml(JSON.stringify(c.albumArtist||c.artist||''))},${escapeHtml(JSON.stringify(c.releaseDate||''))},${escapeHtml(JSON.stringify(c.edition||''))})'>${escapeHtml(t('review.online.confirm.btn'))}</button>` : ''}
        </div>`;
        }).join('');

        const fileRows = (item.files || []).map(f => `<tr>
            <td>${escapeHtml(f.fileName || '')}</td>
            <td>${escapeHtml(f.title || '')}</td>
            <td>${escapeHtml(f.artist || '')}</td>
            <td>${f.duration == null ? '-' : formatDuration(f.duration)}</td>
        </tr>`).join('');

        document.getElementById('detail').innerHTML = `
            <div class="detail-head">
                <span>${escapeHtml(item.folderName || '')}</span> ${statusBadge(item.status)}
            </div>
            <div class="hint">${escapeHtml(item.folderPath || '')}</div>
            <div class="hint">${escapeHtml(item.reason || '')}</div>
            ${pending ? renderSystemSuggestion(item) : ''}
            <div class="detail-facts">
                <div class="fact">
                    <div class="fact-label">${escapeHtml(t('review.fact.synth.title'))}</div>
                    <div class="fact-value">${escapeHtml(item.synthesizedAlbumTitle || '-')}</div>
                </div>
                <div class="fact">
                    <div class="fact-label">${escapeHtml(t('review.fact.synth.artist'))}</div>
                    <div class="fact-value">${escapeHtml(item.synthesizedAlbumArtist || '-')}</div>
                </div>
                <div class="fact">
                    <div class="fact-label">${escapeHtml(t('review.fact.local.evidence'))}</div>
                    <div class="fact-value">${item.localEvidenceAvailable && validScore(item.confidence) ? percent(item.confidence) : escapeHtml(t('review.not.applicable'))}</div>
                </div>
            </div>
            <div class="confidence-note">${escapeHtml(t('review.confidence.note'))}</div>

            ${(item.candidates || []).length ? `<div class="section">
                <div class="section-title">
                    ${escapeHtml(t('review.section.mb.candidates'))}
                    ${item.candidatesExpanded ? '' :
                        `<button class="btn ghost sm" onclick="openItem('${item.id}', true)">${escapeHtml(t('review.expand.releases'))}</button>
                         <span class="hint">${escapeHtml(t('review.expand.retry.hint'))}</span>`}
                </div>
                ${candidateRows ? `<div class="table-wrap table-scroll"><table class="table">
                    <thead><tr><th>${escapeHtml(t('review.table.album'))}</th><th>${escapeHtml(t('review.table.format'))}</th><th>${escapeHtml(t('review.table.tracks'))}</th><th>${escapeHtml(t('review.table.duration.similarity'))}</th><th>${escapeHtml(t('review.table.sample.support'))}</th><th></th></tr></thead>
                    <tbody>${candidateRows}</tbody></table></div>`
                    : `<div class="empty">${escapeHtml(t('review.no.candidates'))}</div>`}
                <div class="hint">${escapeHtml(t('review.candidates.hint'))}</div>
            </div>` : ''}

            ${llmBlock}

            ${(item.onlineCandidates||[]).length || (item.onlineClues||[]).length ? `<div class="section">
                <div class="section-title">${escapeHtml(t('review.section.online'))} ${item.onlineEvidenceStale ? `<span class="badge rejected">${escapeHtml(t('review.evidence.stale'))}</span>` : ''}</div>
                <div class="hint">${escapeHtml(tf('review.online.meta', item.onlineSearchProvider||'', item.onlineSearchModel||'', item.onlineSearchedAt?new Date(item.onlineSearchedAt).toLocaleString():'-'))}</div>
                ${onlineRows || `<div class="empty">${escapeHtml(t('review.online.none'))}</div>`}
                ${(item.onlineClues||[]).length ? `<details><summary>${escapeHtml(tf('review.clues.summary', item.onlineClues.length))}</summary>${item.onlineClues.map(s=>`<div class="hint">${linkOrText(s.url, s.title||s.url||t('review.clue'))}</div>`).join('')}</details>`:''}
            </div>` : ''}

            <div class="section">
                <div class="section-title">${escapeHtml(tf('review.section.files', (item.files || []).length))}</div>
                <div class="table-wrap table-scroll"><table class="table">
                    <thead><tr><th>${escapeHtml(t('review.table.filename'))}</th><th>${escapeHtml(t('review.table.track'))}</th><th>${escapeHtml(t('review.table.artist'))}</th><th>${escapeHtml(t('review.table.length'))}</th></tr></thead>
                    <tbody>${fileRows}</tbody>
                </table></div>
            </div>

            <div class="actions">
                ${item.status === 'REJECTED' ? `<button class="btn primary" onclick="unrejectItem()">
                    ${escapeHtml(t('review.action.unreject'))}
                </button>` : ''}
                ${pending ? `<button class="btn ghost ${searchRecommended ? 'online-search-recommended' : ''}" id="onlineSearchBtn" ${onlineSearchRunning ? 'disabled' : ''} onclick="onlineSearch()">
                    ${escapeHtml(t('review.action.online.search'))}
                </button>` : ''}
                ${pending ? `<details class="more-actions">
                    <summary>${escapeHtml(t('review.action.more'))}</summary>
                    <div class="more-actions-body">
                        ${item.llmJudgeEnabled ? `<button class="btn ghost" ${suggestion.hasReleaseLevelCandidate ? '' : 'disabled'} onclick="llmJudge()">
                            ${escapeHtml(t('review.action.llm.choose'))}
                        </button>` : ''}
                        ${primaryAction === 'ARCHIVE' ? '' : `<button class="btn ghost" onclick="archiveItem(false)">
                            ${escapeHtml(t('review.action.archive'))}
                        </button>`}
                        <button class="btn danger" onclick="rejectItem()">${escapeHtml(t('review.action.reject'))}</button>
                    </div>
                </details>` : ''}
            </div>
            <div class="hint" style="margin-top: 12px;">
                ${escapeHtml(t('review.action.hint.confirm'))}<br>
                ${escapeHtml(t('review.action.hint.archive'))}<br>
                ${escapeHtml(t('review.action.hint.reject'))}
            </div>
            ${item.resolutionNote ? `<div class="hint">${escapeHtml(tf('review.resolution', item.resolutionNote))}</div>` : ''}
        `;
    }

    function renderSystemSuggestion(item) {
        const suggestion = item.systemSuggestion;
        if (!suggestion) return '';
        const level = suggestion.level || 'WEAK_ALL';
        const params = suggestion.primaryActionParams || {};
        const localScore = validScore(suggestion.localScore) ? percent(suggestion.localScore) : null;
        const onlineScore = validScore(suggestion.onlineScore) ? percent(suggestion.onlineScore) : null;
        const llmScore = validScore(suggestion.llmScore) ? percent(suggestion.llmScore) : null;
        const signals = [];
        if (localScore) signals.push(`<span class="signal">${escapeHtml(tf('review.suggestion.signal.local', localScore))}</span>`);
        if (onlineScore) signals.push(`<span class="signal online">${escapeHtml(tf('review.suggestion.signal.online', onlineScore))}</span>`);
        if (llmScore) signals.push(`<span class="signal llm">${escapeHtml(tf('review.suggestion.signal.llm', llmScore))}</span>`);
        if (suggestion.onlineEvidenceStale) signals.push(`<span class="signal stale">${escapeHtml(t('review.signal.stale'))}</span>`);

        let note = '';
        if (suggestion.llmDirection) {
            note = `<div class="hint">${escapeHtml(t('review.suggestion.llm.' + suggestion.llmDirection))}</div>`;
        }
        let button = '';
        if (suggestion.primaryAction === 'CONFIRM_LOCAL') {
            const current = (item.candidates || []).find(c => c.releaseId && c.releaseId === params.releaseId);
            if (current) {
                button = `<button class="btn primary" onclick='confirmCandidate(${JSON.stringify(current.releaseId)},${JSON.stringify(current.releaseGroupId || '')})'>${escapeHtml(t('review.suggestion.action.confirm'))}</button>`;
            } else {
                note += `<div class="hint">${escapeHtml(t('review.suggestion.action.unavailable'))}</div>`;
            }
        } else if (suggestion.primaryAction === 'EXPAND') {
            button = `<button class="btn primary" onclick="openItem('${item.id}', true)">${escapeHtml(t('review.suggestion.action.expand'))}</button>`;
        } else if (suggestion.primaryAction === 'ONLINE_SEARCH') {
            button = `<button class="btn primary" ${onlineSearchRunning ? 'disabled' : ''} onclick="onlineSearch()">${escapeHtml(t('review.suggestion.action.search'))}</button>`;
        } else if (suggestion.primaryAction === 'CONFIRM_ONLINE') {
            const current = (item.onlineCandidates || []).find(c => c.id && c.id === params.onlineCandidateId);
            if (current && !suggestion.onlineEvidenceStale) {
                button = `<button class="btn primary" onclick='confirmOnline(${escapeHtml(JSON.stringify(current.id))},${escapeHtml(JSON.stringify(current.title || ''))},${escapeHtml(JSON.stringify(current.albumArtist || current.artist || ''))},${escapeHtml(JSON.stringify(current.releaseDate || ''))},${escapeHtml(JSON.stringify(current.edition || ''))})'>${escapeHtml(t('review.suggestion.action.confirm.online'))}</button>`;
            } else {
                note += `<div class="hint">${escapeHtml(t('review.suggestion.action.unavailable'))}</div>`;
            }
        } else if (suggestion.primaryAction === 'ARCHIVE') {
            button = `<button class="btn danger" onclick="archiveItem(true)">${escapeHtml(t('review.action.archive.recommended'))}</button>`;
        }
        const cardClass = level === 'CONFLICT' ? ' conflict' : (level === 'SUGGEST_ARCHIVE_UNVERIFIED' ? ' archive' : '');
        return `<div class="suggestion-card${cardClass}">
            <div class="suggestion-title">${escapeHtml(t('review.suggestion.title'))}</div>
            <div class="suggestion-conclusion">${escapeHtml(t('review.suggestion.level.' + level))}</div>
            ${note}
            ${signals.length ? `<div class="suggestion-signals">${signals.join('')}</div>` : ''}
            ${button ? `<div class="suggestion-primary">${button}</div>` : ''}
        </div>`;
    }

    let pendingOnlineCandidateId = null;
    let pendingCoverSha256 = null;

    function formatBytes(value) {
        if (value < 1024) return value + ' B';
        if (value < 1024 * 1024) return (value / 1024).toFixed(0) + ' KB';
        return (value / 1024 / 1024).toFixed(1) + ' MB';
    }

    function chooseCover(sha) {
        pendingCoverSha256 = sha || null;
        document.querySelectorAll('#coverChoices .cover-choice').forEach(el =>
            el.classList.toggle('selected', !!sha && el.dataset.sha === sha));
    }
    function chooseNoCover() { chooseCover(null); }

    async function loadCoverChoices(candidateId) {
        const box = document.getElementById('coverChoices');
        box.innerHTML = `<span class="hint">${escapeHtml(t('review.online.cover.loading'))}</span>`;
        try {
            const data = await api('/api/review/cover-candidates', {
                method: 'POST',
                body: JSON.stringify({ id: currentId, candidateId })
            });
            const rows = data.coverCandidates || [];
            box.innerHTML = rows.length ? rows.map(c => `<div class="cover-choice" data-sha="${escapeHtml(c.sha256)}" onclick="chooseCover('${escapeHtml(c.sha256)}')">
                <img loading="lazy" src="/api/cover?candidateSha256=${encodeURIComponent(c.sha256)}" alt="">
                <div class="cover-meta"><strong>${escapeHtml(t('review.online.cover.origin.' + c.origin))}</strong>${c.originLabel ? ' · ' + escapeHtml(c.originLabel) : ''}<br>${c.width}×${c.height} · ${formatBytes(c.bytes)}</div>
            </div>`).join('') : `<span class="hint">${escapeHtml(t('review.online.cover.empty'))}</span>`;
        } catch (e) {
            box.innerHTML = `<span class="hint">${escapeHtml(humanError(e.message))}</span>`;
        }
    }

    function confirmOnline(candidateId, title, artist, releaseDate, edition) {
        if (!currentId) return;
        pendingOnlineCandidateId = candidateId;
        pendingCoverSha256 = null;
        document.getElementById('ocTitle').value = title || '';
        document.getElementById('ocArtist').value = artist || '';
        document.getElementById('ocDate').value = releaseDate || '';
        document.getElementById('ocEdition').value = edition || '';
        document.getElementById('ocDir').value = '';
        document.getElementById('onlineDialog').classList.add('show');
        loadCoverChoices(candidateId);
    }

    function closeOnlineDialog() {
        document.getElementById('onlineDialog').classList.remove('show');
        pendingOnlineCandidateId = null;
        pendingCoverSha256 = null;
    }

    async function submitOnlineConfirm() {
        if (!currentId || pendingOnlineCandidateId === null) return;
        const payload = {
            id: currentId,
            candidateId: pendingOnlineCandidateId,
            albumTitle: document.getElementById('ocTitle').value.trim(),
            albumArtist: document.getElementById('ocArtist').value.trim(),
            releaseDate: document.getElementById('ocDate').value.trim(),
            edition: document.getElementById('ocEdition').value.trim(),
            archiveDirectoryName: document.getElementById('ocDir').value.trim(),
            selectedCoverSha256: pendingCoverSha256
        };
        if (!payload.albumTitle) {
            toast(t('review.album.title.required'));
            return;
        }
        closeOnlineDialog();
        await runAction('/api/review/online-confirm', payload);
    }

    async function confirmCandidate(releaseId, releaseGroupId) {
        if (!currentId) return;
        if (!confirm(t('review.confirm.candidate'))) return;
        await runAction('/api/review/confirm', { id: currentId, releaseId, releaseGroupId });
    }

    async function llmJudge() {
        if (!currentId) return;
        // 会先从 MusicBrainz 展开版本明细再调用模型，可能需要十几秒
        toast(t('review.llm.running'));
        await runAction('/api/review/llm', { id: currentId });
    }

    async function onlineSearch() {
        if (!currentId || onlineSearchRunning) return;
        onlineSearchRunning = true;
        const button = document.getElementById('onlineSearchBtn');
        if (button) button.disabled = true;
        toast(t('review.online.search.running'));
        try {
            await runAction('/api/review/online-search', { id: currentId, analyzeCover: false });
        } finally {
            onlineSearchRunning = false;
            const currentButton = document.getElementById('onlineSearchBtn');
            if (currentButton) currentButton.disabled = false;
        }
    }

    async function archiveItem(recommended) {
        if (!currentId) return;
        const suggestion = currentItem && currentItem.systemSuggestion ? currentItem.systemSuggestion : {};
        let message = recommended || suggestion.primaryAction === 'ARCHIVE'
            ? t('review.archive.confirm.recommended') : t('review.archive.confirm');
        if (suggestion.neverSearchedOnline === true) {
            message += '\n\n' + t('review.archive.confirm.never.searched');
        }
        if (!confirm(message)) return;
        await runAction('/api/review/archive', { id: currentId });
    }

    async function unrejectItem() {
        if (!currentId) return;
        if (!confirm(t('review.unreject.confirm'))) return;
        await runAction('/api/review/unreject', { id: currentId });
    }

    function rejectItem() {
        if (!currentId) return;
        document.getElementById('rejectNote').value = '';
        document.getElementById('rejectDialog').classList.add('show');
    }

    function closeRejectDialog() {
        document.getElementById('rejectDialog').classList.remove('show');
    }

    async function submitReject() {
        if (!currentId) return;
        const note = document.getElementById('rejectNote').value;
        closeRejectDialog();
        await runAction('/api/review/reject', { id: currentId, note });
    }

    async function runAction(path, body) {
        try {
            const data = await api(path, { method: 'POST', body: JSON.stringify(body) });
            // 部分失败时后端会把条目保留在 PENDING_REVIEW，不能报「成功」
            if (data.item && data.item.status === 'PENDING_REVIEW' && path !== '/api/review/unreject') {
                if (data.item.llmSuggestion && !data.item.llmSuggestion.applied
                    && path === '/api/review/llm') {
                    toast(t('review.llm.done.suggestion'));
                } else if (path === '/api/review/llm') {
                    toast(t('review.llm.done'));
                } else {
                    toast(tf('review.partial.success', data.item.resolutionNote || ''));
                }
            } else {
                toast(t('review.action.success'));
            }
            renderDetail(data.item);
            loadList();
        } catch (e) {
            toast(tf('review.action.failed', humanError(e.message)));
        }
    }

    function validScore(value) {
        return Number.isFinite(Number(value)) && Number(value) >= 0 && Number(value) <= 1;
    }

    function percent(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return '-';
        return (Math.max(0, Math.min(1, n)) * 100).toFixed(0) + '%';
    }

    function baseName(path) {
        return String(path || '').split(/[\\/]/).pop() || '';
    }

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return m + ':' + String(s).padStart(2, '0');
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 联网候选里的 URL 可能直接来自模型输出，只放行 http/https，挡住 javascript: 等协议
    function safeUrl(url) {
        const raw = String(url == null ? '' : url).trim();
        if (!/^https?:\/\//i.test(raw)) return null;
        return escapeHtml(raw);
    }

    function linkOrText(url, label) {
        const href = safeUrl(url);
        const text = escapeHtml(label || url || t('review.source'));
        return href ? `<a href="${href}" target="_blank" rel="noopener">${text}</a>` : text;
    }

    // ESC 关闭任意弹窗
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeOnlineDialog();
            closeRejectDialog();
        }
    });

    // 点击遮罩层空白处关闭
    document.querySelectorAll('.overlay').forEach(el => {
        el.addEventListener('mousedown', (e) => {
            if (e.target === el) el.classList.remove('show');
        });
    });

    init();
</script>
</body>
</html>
