# ---- Maintenance: cover backfill ----
tool.backfill.title=Backfill Covers For History Records
tool.backfill.desc=Files processed by early versions have no album ID recorded, so the dashboard can only show placeholders. This tool re-matches albums by name on MusicBrainz, writes the IDs back and warms up the cover cache.
tool.backfill.hint=Only missing album ID fields are written; no audio file is modified and no existing value is overwritten. Requests are sent per album (not per file) and MusicBrainz is rate-limited to about one request per second. You can stop at any time; a rerun only processes what is left. Albums that cannot be matched confidently are skipped, because no cover is better than a wrong cover.
