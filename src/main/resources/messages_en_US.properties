recovery.notice.1="Partial matches" and "failed" are usually mutually exclusive: once a folder is fully written to the partial directory no failed copy is produced; failed copies are still kept for review on processing errors, name collisions or LLM auto-archiving.
recovery.notice.2="Re-identify" runs quick scan, audio fingerprinting and the MusicBrainz flow again; on success the current quarantined copy and any legacy copy of the same name in the other category follow the trash retention policy.
recovery.notice.3=Partial matches can also use the LLM alone to map existing artist tags to artist folders in the output directory. The LLM never creates new artists.
