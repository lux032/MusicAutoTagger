# ---- Settings: LLM providers & advanced options ----
config.llm.allow.private=Allow Private / HTTP Endpoints
config.llm.allow.private.hint=Disabled by default. "Fetch models" makes the server request the URL you enter, so allowing private addresses turns a logged-in session into an SSRF probe. Only enable it when connecting to a self-hosted Ollama / vLLM.
settings.section.llm.providers=Providers & Models
config.llm.providers.list=Provider List
config.llm.providers.list.hint=Tried top-down: providers in order, then models inside each provider. The next one is used only after the previous one fails.
config.llm.providers.add=+ Add Provider
config.llm.providers.save=Save Providers
settings.section.llm.params=LLM Call Parameters
config.llm.max.tokens=Max Output Tokens
config.llm.max.tokens.hint=Used for short answers such as artist matching and album judgment; the default 600 is enough. Web search uses a separate value below. Range 1-32000.
config.llm.temperature=Temperature
config.llm.temperature.hint=Keep 0 for recognition tasks to avoid model improvisation. Range 0-2 (Anthropic max is 1).
config.llm.timeout=Request Timeout (s)
config.llm.max.retries=Max Retries
config.llm.websearch.max.tokens=Web Search Max Output Tokens
config.llm.websearch.max.tokens.hint=Web search returns up to 5 candidates, each with a full track list and source URLs, so it needs a far larger budget than normal calls. Too small a value truncates the JSON and breaks parsing. Range 256-32000.
config.llm.websearch.timeout=Web Search Timeout (s)
config.llm.websearch.timeout.hint=Search alone takes tens of seconds and may run two rounds. Range 30-900.
settings.section.websearch=Web Search Source
config.websearch.provider=Search Implementation
config.websearch.provider.hint=native relies on the model vendor's built-in search tool; most third-party OpenAI-compatible endpoints do not support it and you cannot verify whether the model really searched. tavily fetches real pages with an external retriever and lets a plain chat endpoint summarize them, so the source URLs are real and verifiable.
config.websearch.provider.native=native (model built-in search)
config.websearch.provider.tavily=tavily (external retrieval + model summary)
config.tavily.api.key=Tavily API Key
config.tavily.api.url=Tavily API URL
config.tavily.search.depth=Search Depth
config.tavily.search.depth.hint=basic is cheaper but returns short snippets; advanced digs deeper and suits niche / non-English releases.
config.tavily.max.results=Results Per Query
config.tavily.timeout=Tavily Request Timeout (s)
config.tavily.include.domains=Restrict Search Domains
config.tavily.include.domains.hint=Comma separated. Leave blank to search the whole web, which noticeably increases low-trust sources; low-trust sources alone cannot form a formal candidate.
settings.section.llm.album=LLM Album Judgment
config.llm.album.judge.enabled=Enable LLM Album Judgment
config.llm.album.judge.enabled.hint=Enables the "LLM Judge" button on the review page. Closed-ended choice: the model can only pick one existing candidate or answer "none of them", and may not invent an album name.
config.llm.album.auto.apply=Auto-apply Judgment When Highly Confident
config.llm.album.auto.apply.hint=When disabled, the judgment is only a suggestion and still needs manual confirmation. When enabled, judgments above the threshold below are written and archived directly, so use it with care.
config.llm.album.auto.apply.confidence=Minimum Confidence For Auto-apply (0-1)
settings.section.partial.admission=Partial Recognition Admission
config.partial.require.readable.tags=Require Readable Tags
config.partial.require.readable.tags.hint=When enabled, only files whose tags can be read normally enter the partial recognition flow, avoiding matching with garbled tags.
config.partial.min.tag.coverage=Minimum Tag Coverage (0-1)
config.partial.min.tag.coverage.hint=Minimum completeness of album / tracknumber tags inside the folder. Below this ratio the folder does not enter partial recognition.
settings.section.review.queue=Review Queue Storage
config.review.queue.path=Queue File Path
config.review.staging.directory=Staging Directory
config.review.staging.directory.hint=When format normalization transcoding happens, the transcoded files are stored here waiting for confirmation.
settings.section.recovery=Re-identification & Recovery
config.recovery.work.directory=Atomic Archive Work Directory
config.recovery.work.directory.hint=Recovery jobs first write the whole album into this directory and commit it to the output directory only after everything succeeds. Blank uses {output directory}/.recovery-work. Keep it on the same disk as the output directory, otherwise committing requires a cross-disk copy.
config.recovery.trash.directory=Trash Directory
config.recovery.trash.directory.hint=After a successful recovery the copy in the quarantine directory is moved here instead of being deleted, so a wrong decision can be rolled back.
config.recovery.trash.retention=Trash Retention Days
config.recovery.trash.retention.hint=0 = delete the copy immediately after success (no rollback, not recommended); -1 = keep forever; 1-365 = keep for that many days. Cleanup runs at every startup.
web.placeholder.default=Leave blank for default
